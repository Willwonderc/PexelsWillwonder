# Légendes Instagram rédigées d'avance, en français, une rubrique par photo : [numéro
# Pexels], une ligne texte, et, si l'on veut, une ligne hashtags (cinq au plus, sinon
# ceux de la photo). La tâche « Photo du jour » ajoute après le texte la phrase fixe
# (« Comme toutes mes photos, elle est libre de droits… le lien est dans ma bio. »), puis
# les hashtags. Une photo sans rubrique reçoit la légende automatique : son titre.
#
# Style voulu par Karl (reseaux/README.md, partie 5) : à la première personne, sobre,
# sans tutoyer ni vouvoyer, sans émoji ; le lieu et le moment quand ils sont connus, un
# peu de contexte (histoire du lieu, nature, astronomie) dans la ligne éditoriale de
# CLAUDE.md, ses souvenirs seulement s'il les a confiés. Uniquement des faits vrais :
# ce que montre la photo, ce que disent le titre, la série, la galerie, les reprises
# par des tiers (vitrine/usages.csv) ou les chiffres de Pexels. Rien d'inventé.
#
# Rubriques dans l'ordre de publication prévu (photos les plus vues d'abord), rédigées
# le 28 septembre 2026 d'après les photos elles-mêmes.

[27116682]
texte = La Voie lactée au-dessus d'une ligne d'arbres. Pour la voir ainsi, il faut s'éloigner des villes et de leurs lumières : c'est notre propre galaxie, vue de l'intérieur de l'un de ses bras. Cette photo, vue plus de 74 000 fois sur Pexels, a aussi été reprise par Cambridge.org.
