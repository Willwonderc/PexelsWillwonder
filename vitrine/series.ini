texte_fr = Aux portes de Gijón, dans les Asturies, se dresse une ville dans la ville. L'Universidad Laboral, construite entre 1946 et 1956 par le régime franquiste, sur les plans de l'architecte Luis Moya Blanco, devait accueillir et former les orphelins des mineurs. Le résultat, souvent présenté comme le plus grand édifice d'Espagne, emprunte aux monastères et aux palais de la Renaissance espagnole : cours à colonnades, théâtre, église elliptique coiffée d'une coupole, et une tour de 130 mètres qu'on voit de toute la ville. Longtemps vitrine du régime, elle est aujourd'hui un centre culturel ouvert à tous.

    La série fait le tour de cet ensemble monumental. La tour et la coupole émergent des arbres et des toits modernes ; la longue façade s'étire au-delà du parking et du terrain de sport ; le noir et blanc souligne les ciels chargés et la pierre. À l'intérieur, une cour aux colonnes corinthiennes sous une verrière et une colonnade vue en contre-plongée donnent la mesure du lieu.

    Rebaptisée Laboral Ciudad de la Cultura en 2007, l'ancienne université abrite aujourd'hui un centre d'art, un théâtre, des écoles et les studios de la radio-télévision publique des Asturies. Ces photos libres de droits conviennent pour illustrer l'architecture, le patrimoine espagnol ou un voyage dans les Asturies, et se téléchargent gratuitement sur Pexels.
texte_en = On the edge of Gijón, in Asturias, stands a city within the city. The Universidad Laboral, built between 1946 and 1956 by the Franco regime, to designs by the architect Luis Moya Blanco, was meant to house and train the orphans of miners. The result, often described as the largest building in Spain, borrows from the monasteries and palaces of the Spanish Renaissance: colonnaded courtyards, a theatre, an elliptical church crowned by a dome, and a 130-metre tower visible from all over the city. Long a showcase of the regime, it is now a cultural centre open to all.

    The series walks around this monumental complex. The tower and the dome rise above trees and modern rooftops; the long façade stretches beyond the car park and the playing field; black and white brings out the heavy skies and the stone. Inside, a courtyard of Corinthian columns under a glass roof, and a colonnade seen from below, give a sense of the scale of the place.

    Renamed Laboral Ciudad de la Cultura in 2007, the former university now houses an art centre, a theatre, schools and the studios of the Asturian public broadcaster. These royalty-free photos suit stories about architecture, Spanish heritage or travel in Asturias, and can be downloaded for free on Pexels.
texte_zh = 在阿斯图里亚斯希洪的城郊，矗立着一座“城中之城”。希洪劳动大学（Universidad Laboral）由佛朗哥政权于1946年至1956年间建造，建筑师路易斯·莫亚·布兰科设计，最初是为矿工的孤儿提供住宿与教育的场所。这座常被称为西班牙最大建筑的建筑群，借鉴了西班牙文艺复兴时期修道院与宫殿的风格：带柱廊的庭院、剧院、顶着穹顶的椭圆形教堂，以及一座全城都能望见的130米高塔。它曾长期是佛朗哥政权的门面工程，如今已成为向所有人开放的文化中心。

    这组照片环绕这座宏伟建筑群展开：高塔与穹顶从树木和现代屋顶之间探出；长长的立面沿着停车场和运动场延伸开去；黑白影调凸显了压抑的天空与石材的质感。室内部分，玻璃穹顶下的科林斯式立柱庭院，以及仰拍的柱廊，都展现出这座建筑的宏大尺度。

    2007年，这所旧大学更名为“文化之城劳动学院”（Laboral Ciudad de la Cultura），如今设有艺术中心、剧院、学校，以及阿斯图里亚斯公共广播电视台的演播室。这些免版税照片适合用于建筑、西班牙文化遗产或阿斯图里亚斯旅行题材的报道，并可在 Pexels 免费下载。

