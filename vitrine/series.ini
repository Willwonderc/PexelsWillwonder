texte_fr = À l'extrémité orientale de la Galice, près de Ribadeo, la mer a sculpté la falaise en arcs-boutants et en piliers. Les Galiciens appellent ce rivage As Catedrais, « les Cathédrales » : à marée basse, on marche sous des arches de pierre comme dans la nef d'une église gothique. À marée haute, la mer remplit les passages, et l'on découvre le site d'en haut, depuis le sentier qui longe la falaise.

    C'est ce second visage que montre la série : des blocs de roche feuilletée dressés dans une eau turquoise, des gorges étroites où l'écume s'engouffre, des cormorans perchés sur des rochers blanchis par le guano. Au large, des bateaux traversent une mer d'huile, en noir et blanc, et dans l'arrière-pays la brume glisse sur les collines couvertes d'eucalyptus.

    Classée monument naturel, la plage des Cathédrales est l'un des sites les plus visités de Galice : en été et à Pâques, l'accès à la plage demande une réservation gratuite. Ces photos libres de droits conviennent pour illustrer la côte atlantique, le voyage en Espagne ou la géologie, et se téléchargent gratuitement sur Pexels.
texte_en = At the eastern end of Galicia, near Ribadeo, the sea has carved the cliffs into flying buttresses and pillars. Galicians call this shore As Catedrais, "the Cathedrals": at low tide, you walk beneath stone arches as if through the nave of a Gothic church. At high tide, the sea fills the passages and the site is seen from above, from the path along the clifftops.

    That second face is the one this series shows: blocks of layered rock standing in turquoise water, narrow gorges where the foam rushes in, cormorants perched on rocks whitened by guano. Offshore, boats cross a glassy sea, in black and white, and inland, mist drifts over hills covered in eucalyptus.

    Protected as a natural monument, the Cathedrals Beach is one of the most visited places in Galicia: in summer and at Easter, access to the beach requires a free booking. These royalty-free photos suit stories about the Atlantic coast, travel in Spain or geology, and can be downloaded for free on Pexels.
texte_zh = 在加利西亚最东端，里瓦德奥附近，海浪将悬崖雕琢成了飞扶壁与石柱的形状。加利西亚人称这片海岸为“As Catedrais”，意为“大教堂”：退潮时，人们可以走在石拱门下，仿佛置身哥特式教堂的中殿；涨潮时，海水灌满通道，人们则从沿崖而行的小径上，居高俯瞰这片景观。

    这组照片呈现的正是涨潮时的景象：层理分明的岩块矗立在碧绿的海水中，海浪涌入狭窄的峡谷，鸬鹚栖息在被鸟粪染白的礁石上。远海处，船只以黑白影调驶过如油般平静的海面；内陆一带，薄雾在覆盖着桉树的丘陵间流动。

    被列为自然纪念地的“大教堂海滩”是加利西亚游客最多的景点之一：夏季与复活节期间，进入海滩需要提前免费预约。这些免版税照片适合用于大西洋海岸、西班牙旅行或地质题材的报道，并可在 Pexels 免费下载。

