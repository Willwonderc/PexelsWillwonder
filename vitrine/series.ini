texte_fr = Le 12 août 2026, en fin de journée, la Lune est passée exactement devant le Soleil au-dessus du nord de l'Espagne. C'était la première éclipse totale visible depuis l'Espagne continentale depuis 1905, et une partie de la Galice se trouvait dans la bande de totalité.

    La série suit l'événement pas à pas. D'abord une petite encoche dans le disque solaire, qui s'élargit en un croissant de plus en plus fin. La lumière baisse, les couleurs se refroidissent, l'air fraîchit. Puis, pendant moins de deux minutes, le Soleil disparaît : il ne reste qu'un disque noir bordé d'un fin liseré rouge, la chromosphère, et entouré de la couronne solaire, l'atmosphère extérieure du Soleil, qu'on ne voit qu'à ce moment-là.

    Les deux dernières images montrent l'autre versant d'une éclipse : ceux qui sont venus la voir ce soir-là. Un observateur debout près d'une voiture, face au ciel assombri ; puis, à la fin du jour, un petit groupe installé sur des chaises de camping face au soleil couchant.

    Ces photos libres de droits peuvent illustrer un article sur l'éclipse de 2026, un cours d'astronomie ou un sujet sur les phénomènes célestes ; elles se téléchargent gratuitement sur Pexels. Prochain rendez-vous en Espagne : l'éclipse totale du 2 août 2027, dans le sud du pays.
texte_en = On 12 August 2026, late in the day, the Moon passed exactly in front of the Sun over northern Spain. It was the first total solar eclipse visible from mainland Spain since 1905, and part of Galicia lay inside the path of totality.

    The series follows the event step by step. First a small notch in the solar disc, which widens into a thinner and thinner crescent. The light drops, colours turn cold, the air cools. Then, for less than two minutes, the Sun disappears: all that remains is a black disc edged with a thin red rim, the chromosphere, and surrounded by the solar corona, the Sun's outer atmosphere, which can only be seen at that moment.

    The last two images show the other side of an eclipse: the people who came to see it that evening. An observer standing by a car, facing the darkened sky; then, at the end of the day, a small group settled on camping chairs facing the setting sun.

    These royalty-free photos can illustrate an article about the 2026 eclipse, an astronomy lesson or a story about celestial events, and can be downloaded for free on Pexels. Next event in Spain: the total eclipse of 2 August 2027, across the south of the country.
texte_zh = 2026年8月12日傍晚，月亮精确地遮住了西班牙北部上空的太阳。这是1905年以来西班牙大陆首次可见的日全食，加利西亚的部分地区正处在全食带之内。

    这组照片按时间顺序记录了整个过程：起初太阳圆面上出现一个小缺口，缺口逐渐扩大成越来越细的月牙；光线渐暗，色调转冷，空气也随之变凉。随后，不到两分钟内，太阳完全消失——只剩下一圈镶着细细红边（色球层）的黑色圆盘，外围环绕着太阳的外层大气日冕，这是唯一能看到日冕的时刻。

    最后两张照片呈现了日食的另一面：当晚前来观看的人们。一位观测者站在车旁，仰望渐暗的天空；随后，在一天的尽头，几个人坐在露营椅上，面对西沉的太阳。

    这些免版税照片可用于报道2026年日食、天文学课程或天体现象的文章，并可在 Pexels 免费下载。西班牙下一次日全食将在2027年8月2日，出现在该国南部。
recit_fr = La dernière éclipse totale visible en France remonte à 1999. Cette fois, je suis allé la chercher en Galice. Au moment de la totalité, la lumière est tombée d'un coup et tout le paysage m'a semblé écrasé par cet événement singulier. Une sensation que je n'oublie pas.
recit_en = The last total eclipse visible in France was in 1999. This time, I went to Galicia to see one. At the moment of totality, the light dropped all at once, and the whole landscape seemed crushed by this singular event. A feeling I have not forgotten.
recit_zh = 上一次在法国看到日全食，还是1999年。这一次，我去了加利西亚追日食。日全食来临的那一刻，天色骤暗，整片风景仿佛被这个罕见的时刻压住了。那种感觉，我至今难忘。

