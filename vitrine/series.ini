texte_fr = À Villandry, en Touraine, le château compte moins que ses jardins. Achevé vers 1536 pour Jean Le Breton, ministre des Finances de François Ier, c'est le dernier des grands châteaux de la Renaissance bâtis au bord de la Loire. Ses jardins sont pourtant récents : au début du XXe siècle, Joachim Carvallo et son épouse Ann Coleman, qui avaient acheté le domaine en 1906, les ont recréés dans l'esprit de la Renaissance, sur trois niveaux de terrasses.

    Vus d'en haut, ils se lisent comme un dessin. Le jardin d'ornement aligne ses broderies de buis taillé ; le potager décoratif, le plus célèbre, assemble neuf carrés de même taille où légumes et fleurs forment des motifs géométriques, replantés deux fois par an ; plus haut, le jardin d'eau s'organise autour d'un grand bassin. Au détour des allées apparaissent l'église du village, le château et ses reflets, et même la cuisine et ses cuivres.

    Les photos ont été prises en plein été, quand les couleurs du potager sont au plus fort. Libres de droits, elles conviennent pour illustrer le jardinage, le patrimoine, le Val de Loire ou le voyage en France, et se téléchargent gratuitement sur Pexels.
texte_en = At Villandry, in Touraine, the gardens matter more than the château. Completed around 1536 for Jean Le Breton, finance minister to King Francis I, it is the last of the great Renaissance châteaux built along the Loire. Yet its gardens are recent: in the early 20th century, Joachim Carvallo and his wife Ann Coleman, who had bought the estate in 1906, recreated them in the spirit of the Renaissance, on three levels of terraces.

    Seen from above, they read like a drawing. The ornamental garden lines up its clipped box embroidery; the decorative kitchen garden, the most famous part, combines nine squares of equal size where vegetables and flowers form geometric patterns, replanted twice a year; higher up, the water garden is arranged around a large pool. Along the paths appear the village church, the château and its reflections, and even the kitchen with its copper pans.

    The photos were taken in high summer, when the colours of the kitchen garden are at their brightest. Royalty-free, they suit stories about gardening, heritage, the Loire Valley or travel in France, and can be downloaded for free on Pexels.
texte_zh = 在都兰地区的维朗德里，城堡本身不及其花园出名。城堡建成于1536年前后，由弗朗索瓦一世的财政大臣让·勒布勒东下令兴建，是卢瓦尔河沿岸最后一座文艺复兴时期的大型城堡。然而它的花园却很年轻：20世纪初，1906年买下庄园的华金·卡瓦略和妻子安·科尔曼，依照文艺复兴的精神，在三层露台上重新设计了这些花园。

    从高处俯瞰，花园宛如一幅图案：装饰性花园以修剪整齐的黄杨木花坛排列成刺绣般的图案；最著名的装饰性菜园由九块大小相同的方地组成，蔬菜与花卉拼出几何图案，每年重新栽种两次；更高处的水景花园则围绕一座大水池布局。沿着小径，还能看到村中的教堂、城堡及其倒影，甚至厨房里悬挂的铜器。

    这些照片拍摄于盛夏时节，正是菜园色彩最浓郁的时候。它们免版税，适合用于园艺、文化遗产、卢瓦尔河谷或法国旅行题材的报道，并可在 Pexels 免费下载。
recit_fr = En France, quand on parle de « jardin à la française », on pense symétrie, géométrie et buis taillés au cordeau. Je suis allé à Villandry pour admirer ces jardins, héritiers d'une tradition de plusieurs siècles de jardin à la française. Le plus étonnant est le potager : choux, poireaux et salades y sont plantés en motifs géométriques, et vus d'en haut ils ressemblent à une broderie.
recit_en = In France, when we speak of a "jardin à la française", a French formal garden, we think of symmetry, geometry and box hedges clipped to perfection. I went to Villandry to admire these gardens, heirs to a tradition of French formal gardens that goes back several centuries. The most surprising part is the kitchen garden: cabbages, leeks and lettuces are planted in geometric patterns, and seen from above they look like embroidery.
recit_zh = 在法国，说起“法式园林”（jardin à la française），我们会想到对称、几何，还有修剪得一丝不苟的黄杨。我去维朗德里，就是为了亲眼欣赏这些花园：它们延续了几个世纪的法式园林传统。这里最特别的是菜园：卷心菜、韭葱和生菜也被种成几何图案，从高处看像一幅刺绣。
francais_en = le potager = the kitchen garden. The word comes from potage, soup: this is where the vegetables for the soup pot grow. Many French families still keep a small one.
    le jardin = the garden. A jardin à la française is a French formal garden.
francais_zh = le potager = 菜园。在法国，很多家庭至今仍有自己的小菜园。
    le jardin = 花园。“法式园林”在法语里就叫 le jardin à la française。

