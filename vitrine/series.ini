texte_fr = En France, août est le mois des vacances. Du 10 au 19 août 2026, une grande boucle en voiture au départ de Niort, dans l'ouest de la France : les Asturies, la Galice et le Pays basque espagnol, puis le Béarn et Bordeaux sur la route du retour.

    La série suit la route, une ou deux photos par étape. À Gijón, la tour de l'Universidad Laboral, immense ensemble bâti au milieu du XXe siècle, dépasse des arbres. En Galice, la mer s'engouffre entre les rochers de la plage des Cathédrales, à Ribadeo ; le 12 août, un observateur regarde l'éclipse totale près d'une voiture et, le soir venu, des chaises de camping font face au coucher de soleil. Au Pays basque, l'hôtel de ville d'Irun et les façades colorées de sa vieille ville annoncent la frontière. En Béarn, le pic du Midi d'Ossau domine les contreforts, et une balise marque le chemin de Saint-Jacques-de-Compostelle. La dernière image vient de Bordeaux, devant les fontaines de la place des Quinconces.

    Ces photos libres de droits conviennent pour illustrer le voyage en Espagne et en France, le road trip ou les vacances d'été, et se téléchargent gratuitement sur Pexels.
texte_en = In France, August is the holiday month. From 10 to 19 August 2026, a long loop by car from Niort, in western France: Asturias, Galicia and the Spanish Basque Country, then the Béarn and Bordeaux on the way home.

    The series follows the road, one or two photos per stage. In Gijón, the tower of the Universidad Laboral, a huge complex built in the mid-20th century, rises above the trees. In Galicia, the sea rushes between the rocks of the Cathedrals Beach at Ribadeo; on 12 August an observer watches the total eclipse next to a car, and that evening camping chairs face the sunset. In the Basque Country, the town hall of Irun and the colourful façades of its old town announce the border. In the Béarn, the Pic du Midi d'Ossau towers over the foothills, and a waymark shows the Way of St James. The last image comes from Bordeaux, at the fountains of the Place des Quinconces.

    These royalty-free photos suit stories about travel in Spain and France, road trips or summer holidays, and can be downloaded for free on Pexels.
texte_zh = 在法国，八月是度假的月份。2026年8月10日至19日，从法国西部的尼奥尔出发，开车走了一个大环线：先到西班牙的阿斯图里亚斯、加利西亚和巴斯克地区，回程再经过法国的贝阿恩和波尔多。

    这组照片沿着这条路线展开，每一站一两张：在希洪，劳动大学（Universidad Laboral）的塔楼从树丛中探出，这座宏大的建筑群建于20世纪中叶；在加利西亚，海水涌入里瓦德奥“大教堂海滩”的礁石之间，8月12日，一位观测者站在车旁观看日全食，当晚人们坐在山顶的露营椅上看日落；在巴斯克地区，伊伦的市政厅和老城多彩的立面，预示着边境就在眼前；在贝阿恩，奥索峰耸立在山麓之上，一枚路标指引着圣地亚哥朝圣之路；最后一张来自波尔多梅花广场的喷泉。

    这些免版税照片适合用于西班牙和法国旅行、自驾游或暑假题材的报道，并可在 Pexels 免费下载。
recit_fr = Le 10 août, Maëlle, ma fiancée, et moi sommes partis de Niort en voiture. À Gijón, nous avons marché dans la ville, visité l'Universidad Laboral et longuement parcouru le jardin botanique atlantique voisin ; le Cola Cao, la boisson chocolatée espagnole, est devenu l'un des souvenirs que nous avons rapportés. Au Pays basque, logés près de Bilbao, nous allions en ville en métro : la vieille ville, les churros trempés dans le chocolat chaud, le musée Guggenheim et Puppy, le grand chien fleuri devant l'entrée. De retour en France, nous avons visité l'église de L'Hôpital-Saint-Blaise, sur le chemin de Saint-Jacques, inscrite au patrimoine mondial de l'UNESCO, avant une dernière étape à la Cité du Vin, à Bordeaux.
recit_en = On 10 August, Maëlle, my fiancée, and I left Niort by car. In Gijón, we walked around the city, visited the Universidad Laboral and spent a long time in the Atlantic Botanical Garden next to it; Cola Cao, the Spanish chocolate drink, became one of the souvenirs we brought home. In the Basque Country, staying near Bilbao, we took the metro into town: the old town, churros dipped in hot chocolate, the Guggenheim Museum and Puppy, the big dog covered in flowers at the entrance. Back in France, we visited the church of L'Hôpital-Saint-Blaise, on the Way of St James, a UNESCO World Heritage Site, before a last stop at the Cité du Vin in Bordeaux.
recit_zh = 8月10日，我和未婚妻 Maëlle 从尼奥尔开车出发。在希洪，我们在城里慢慢走，参观了劳动大学，又在一旁的大西洋植物园走了很久；西班牙的巧克力饮料 Cola Cao，后来成了我们带回家的纪念品。在巴斯克地区，我们住在毕尔巴鄂附近，坐地铁进城：逛古城，吃 churros 蘸热巧克力，看古根海姆美术馆和门口开满鲜花的大狗 Puppy。回到法国，我们参观了圣地亚哥朝圣之路上的 L'Hôpital-Saint-Blaise 教堂，它是联合国教科文组织世界遗产；最后一站是波尔多的葡萄酒城。
