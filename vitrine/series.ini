texte_fr = Avec sa double pointe reconnaissable entre toutes, le Pic du Midi d'Ossau (2 884 mètres) est l'emblème du Béarn. Par temps clair, on l'aperçoit depuis le boulevard des Pyrénées, à Pau, et les Béarnais le surnomment affectueusement « Jean-Pierre ». Cette silhouette de dent brisée est le reste d'un ancien volcan, vieux de près de 280 millions d'années, que l'érosion a mis à nu.

    La série le regarde de loin, au téléobjectif, par-delà les collines et la brume de l'été qui étage les crêtes en camaïeu de bleus. Plus près, au pied des montagnes, les villages du piémont s'étendent entre prairies closes de barrières de bois et forêts. En chemin : des chevaux à l'ombre des arbres, une blonde d'Aquitaine au pré, l'église de Buzy, à l'entrée de la vallée d'Ossau, la mousse sur les rochers et un dolmen, l'un de ces monuments de pierre dressés ici il y a des millénaires.

    Ces photos libres de droits conviennent pour illustrer la montagne, la vie rurale, la randonnée ou le voyage dans les Pyrénées-Atlantiques, et se téléchargent gratuitement sur Pexels.
texte_en = With its twin summit, unlike any other, the Pic du Midi d'Ossau (2,884 metres) is the emblem of the Béarn. On clear days it can be seen from the Boulevard des Pyrénées in Pau, and locals affectionately call it "Jean-Pierre". This broken-tooth silhouette is what remains of an ancient volcano, nearly 280 million years old, laid bare by erosion.

    The series looks at it from afar, through a telephoto lens, beyond the hills and the summer haze that layers the ridges in shades of blue. Closer in, at the foot of the mountains, the villages of the foothills spread out between meadows fenced with wooden rails and forests. Along the way: horses in the shade of the trees, a Blonde d'Aquitaine cow in its pasture, the church of Buzy at the entrance to the Ossau Valley, moss on the rocks and a dolmen, one of the stone monuments raised here thousands of years ago.

    These royalty-free photos suit stories about the mountains, rural life, hiking or travel in the Pyrénées-Atlantiques, and can be downloaded for free on Pexels.

[nuits-etoilees]
titre_fr = Nuits étoilées
titre_en = Starry nights
lieu_fr = France et Espagne
lieu_en = France and Spain
date_fr = 2022 à 2026
date_en = 2022 to 2026
photos = 27116682, 39595391, 39650070, 39595392, 24200555, 13102252, 38570570, 39632228, 39632229
couverture = 27116682
texte_fr = Il faut s'éloigner des villes pour retrouver la nuit. Loin des lampadaires, le ciel se remplit d'étoiles et la Voie lactée apparaît comme une longue traînée laiteuse : c'est notre propre galaxie, vue par la tranche, depuis l'intérieur de l'un de ses bras.

    Cette série rassemble des nuits photographiées au fil des années. La Voie lactée s'élève au-dessus d'une ligne d'arbres, puis au-dessus de la campagne galicienne, près de Lugo, où l'on distingue aussi la galaxie d'Andromède, l'un des objets les plus lointains visibles à l'œil nu, à 2,5 millions d'années-lumière. Ailleurs, les étoiles percent entre les nuages au-dessus des toits d'un village, la pleine lune se lève derrière les cheminées, et la brume éclairée par la lune dessine la silhouette d'un pin.

    La plus vue de ces images n'est pas tout à fait nocturne : un fin croissant de lune dans le dégradé du crépuscule, entre le bleu de la nuit et l'orange du soleil couché. Photographier les étoiles demande de la patience : une nuit sans lune ni nuages, un trépied et des poses de plusieurs secondes.

    Ces photos libres de droits conviennent pour des fonds d'écran, l'astronomie, la science ou la méditation, et se téléchargent gratuitement sur Pexels.
texte_en = You have to leave the cities behind to find the night again. Away from street lights, the sky fills with stars and the Milky Way appears as a long milky band: our own galaxy, seen edge-on from inside one of its arms.

    This series brings together nights photographed over the years. The Milky Way rises above a line of trees, then over the Galician countryside near Lugo, where the Andromeda Galaxy can also be made out, one of the most distant objects visible to the naked eye, 2.5 million light-years away. Elsewhere, stars break through the clouds above the roofs of a village, the full moon rises behind chimneys, and moonlit mist outlines the silhouette of a pine tree.

    The most viewed of these images is not quite nocturnal: a thin crescent moon in the gradient of dusk, between the blue of the night and the orange of the set sun. Photographing the stars takes patience: a night without moon or clouds, a tripod and exposures of several seconds.

    These royalty-free photos suit wallpapers, astronomy, science or meditation, and can be downloaded for free on Pexels.
