texte_fr = Plusieurs chemins de Saint-Jacques-de-Compostelle traversent le Béarn : la voie du Puy par Navarrenx, la voie d'Arles par Oloron-Sainte-Marie et le col du Somport, et la voie du piémont pyrénéen, qui longe le pied des montagnes. Entre Pau et la vallée d'Ossau, les pèlerins y suivent des sentiers anciens, bordés de murets de pierre et ombragés par les arbres.

    La série parcourt l'une de ces étapes. Le sentier s'enfonce sous les arbres, grimpe sur la roche et croise, sur un tronc, une balise du chemin de Saint-Jacques, à côté des marques rouge et blanc des sentiers de grande randonnée. À l'orée d'une clairière, un bloc de pierre couvert de mousse, laissé là par les glaciers, fait face aux montagnes.

    Puis vient la halte dans une église. Les images y deviennent plus libres : poses longues et flous volontaires, la lampe rouge du sanctuaire devant un tabernacle doré, un retable baroque entre deux fenêtres baignées de lumière, un Christ dans une niche de pierre, un vitrail rond, quelques cierges dans la pénombre. Une manière de rendre le silence et la lumière de ces lieux plutôt que leur architecture.

    Ces photos libres de droits conviennent pour illustrer la randonnée, le pèlerinage, le patrimoine religieux ou les Pyrénées-Atlantiques, et se téléchargent gratuitement sur Pexels.
texte_en = Several routes to Santiago de Compostela cross the Béarn: the Le Puy route through Navarrenx, the Arles route through Oloron-Sainte-Marie and the Somport pass, and the Pyrenean foothills route, which runs along the base of the mountains. Between Pau and the Ossau Valley, pilgrims follow old paths lined with low stone walls and shaded by trees.

    The series walks one of these stages. The path plunges under the trees, climbs over rock and passes a waymark of the Way of St James on a trunk, next to the red and white stripes of the long-distance trails. At the edge of a clearing, a moss-covered boulder, left behind by the glaciers, faces the mountains.

    Then comes a pause in a church. There, the images become freer: long exposures and deliberate blur, the red sanctuary lamp before a gilded tabernacle, a baroque altarpiece between two windows flooded with light, a statue of Christ in a stone niche, a round stained-glass window, a few candles in the half-light. A way of conveying the silence and light of these places rather than their architecture.

    These royalty-free photos suit stories about hiking, pilgrimage, religious heritage or the Pyrénées-Atlantiques, and can be downloaded for free on Pexels.
texte_zh = 数条前往圣地亚哥·德·孔波斯特拉的朝圣路线穿过贝阿恩地区：经纳瓦伦克斯的“勒皮之路”、经奥洛龙-圣玛丽和松波特山口的“阿尔勒之路”，以及沿比利牛斯山麓延伸的“山麓之路”。在波城与奥索峡谷之间，朝圣者沿着古老的小径前行，两旁是石砌矮墙，头顶树荫遮蔽。

    这组照片记录了其中一段路程：小径没入林荫深处，攀上岩石，途中一棵树干上贴着圣地亚哥之路的标志，旁边是长途徒步路线的红白标记。林间空地边缘，一块被冰川遗留下来、长满苔藓的巨石，正对着远处的群山。

    接着，旅程在一座教堂中稍作停留。这里的影像变得更为自由：长曝光与刻意的虚化，镀金圣龛前的红色长明灯，两扇洒满光线的窗户间的巴洛克式祭坛画，石龛中的基督像，一扇圆形彩色玻璃窗，昏暗中的几支蜡烛——与其说是记录建筑，不如说是捕捉这些场所的寂静与光线。

