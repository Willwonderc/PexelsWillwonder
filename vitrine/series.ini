texte_fr = Ouverte sur la Garonne, la place des Quinconces compte parmi les plus grandes places d'Europe. Son grand monument, élevé entre 1894 et 1902 sous la IIIe République et connu sous le nom de monument aux Girondins, célèbre avant tout la République : au sommet de la colonne, la Liberté brise ses chaînes ; à ses pieds, deux grandes fontaines de bronze figurent le Triomphe de la République, avec son char tiré par des chevaux marins, et le Triomphe de la Concorde. Sous l'Occupation, en 1943, ces bronzes ont été déposés pour être fondus au profit de l'occupant ; épargnés, ils n'ont retrouvé leur place qu'en 1983.

    La série s'approche de ces bronzes verdis par le temps : la Liberté ailée sur le ciel bleu, une figure couronnée de laurier qui s'élève de la fontaine, les chevaux et les angelots au milieu des éclaboussures. La dernière photo quitte la place pour la table : des cannelés, les petits gâteaux de Bordeaux, à la croûte caramélisée et au cœur moelleux, parfumés au rhum et à la vanille.

    Ces photos libres de droits conviennent pour illustrer Bordeaux, la sculpture, l'histoire de la République ou la pâtisserie, et se téléchargent gratuitement sur Pexels.
texte_en = Opening onto the Garonne, the Place des Quinconces is one of the largest squares in Europe. Its great monument, built between 1894 and 1902 under the Third Republic and known as the Girondins monument, above all celebrates the Republic: at the top of the column, Liberty breaks her chains; at its foot, two great bronze fountains depict the Triumph of the Republic, with its chariot drawn by sea horses, and the Triumph of Concord. Under the Occupation, in 1943, these bronzes were taken down to be melted for the occupying forces; spared, they only returned in 1983.

    The series moves in close to these bronzes, turned green by time: winged Liberty against the blue sky, a laurel-crowned figure rising from the fountain, horses and cherubs among the splashes. The last photo leaves the square for the table: cannelés, Bordeaux's little cakes, with a caramelised crust and a soft centre, flavoured with rum and vanilla.

    These royalty-free photos suit stories about Bordeaux, sculpture, the history of the Republic or pastry, and can be downloaded for free on Pexels.
texte_zh = 梅花广场（Place des Quinconces）面向加龙河，是欧洲最大的广场之一。广场上的纪念碑建于1894年至1902年法兰西第三共和国时期，通称吉伦特派纪念碑，歌颂的首先是共和国：纪念柱顶端，自由女神挣断锁链；柱脚下的两座巨大青铜喷泉，分别表现“共和国的胜利”（骏马拉着的战车）与“协和的胜利”。1943年德占时期，这些铜像被拆下准备熔毁；它们幸免于难，直到1983年才重回原位。

    这组照片走近这些历经岁月、泛着铜绿的青铜像：蓝天下展翅的自由女神，从喷泉中升起、头戴月桂冠的人物，水花之间的骏马与小天使。最后一张离开广场，来到餐桌：波尔多的小甜点可露丽，外壳焦糖色，内里柔软，带着朗姆酒和香草的香气。

    这些免版税照片适合用于波尔多、雕塑、共和国历史或甜点题材的报道，并可在 Pexels 免费下载。
recit_fr = Au retour de notre road trip d'août, Maëlle, ma fiancée, et moi sommes passés exprès par Bordeaux : ce qui aurait pu n'être qu'une journée de route est devenu la dernière étape du voyage. Nous avons visité la Cité du Vin, dont l'exposition permanente raconte l'histoire et les cultures du vin dans le monde ; la visite se termine par une dégustation.
recit_en = On the way back from our August road trip, Maëlle, my fiancée, and I went through Bordeaux on purpose: what could have been just a day of driving became the last stop of the journey. We visited the Cité du Vin, whose permanent exhibition tells the history and cultures of wine around the world; the visit ends with a tasting.
recit_zh = 八月公路旅行的回程，我和未婚妻 Maëlle 特意绕道波尔多：本来只是开车回家的一天，变成了旅行的最后一站。我们参观了葡萄酒城（La Cité du Vin），常设展讲述世界各地葡萄酒的历史与文化，参观的最后还有一杯品鉴。
francais_en = le cannelé = Bordeaux's little cake. Cannelé means fluted, after the grooves of its mould.
    la dégustation = a tasting: une dégustation de vin is a wine tasting.
    Santé ! = Cheers! In France, you look each other in the eye when you clink glasses; otherwise, the saying goes, it's seven years of bad luck.
francais_zh = le cannelé = 可露丽。cannelé 的意思是“有凹槽的”，名字来自它带凹槽的模具。
    la dégustation = 品鉴。品尝葡萄酒就叫 une dégustation de vin。
    Santé ! = 干杯！法国人碰杯时，要看着对方的眼睛，据说不然会倒霉七年。
