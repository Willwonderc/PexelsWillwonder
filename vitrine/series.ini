texte_fr = L'été, beaucoup de Français partent sur les côtes de Normandie et de Bretagne. Rien à voir avec la Méditerranée bleue du Sud : les marées y sont immenses, la brume arrive sans prévenir, et les phares veillent sur les passes.

    La série longe cette côte : le phare du Loup, solitaire dans la brume, un phare sur la côte rocheuse de Granville, des rochers battus par les vagues. Au large de Granville, les îles Chausey ne se rejoignent qu'en bateau ; on y croise un monument de pierre en forme de pyramide au milieu de la verdure et une maison posée sur les rochers. La série finit au Mont-Saint-Michel, sous les arches gothiques et les vitraux de l'abbaye, puis à Saint-Malo.

    La baie du Mont-Saint-Michel, entre Normandie et Bretagne, connaît l'un des plus grands marnages d'Europe : à marée haute, le Mont redevient une île. Ces photos libres de droits conviennent pour illustrer la mer, les phares ou le voyage en France, et se téléchargent gratuitement sur Pexels.
texte_en = In summer, many French people head for the coasts of Normandy and Brittany. Nothing like the blue Mediterranean of the south: the tides are huge, the fog rolls in without warning, and lighthouses watch over the channels.

    The series follows this coast: the Le Loup lighthouse, alone in the sea mist, a lighthouse on the rocky shore of Granville, rocks battered by the waves. Off Granville, the Chausey Islands can only be reached by boat; there, a pyramid-shaped stone monument stands among the greenery and a house sits on the rocks. The series ends at Mont-Saint-Michel, beneath the Gothic arches and stained glass of the abbey, then in Saint-Malo.

    The bay of Mont-Saint-Michel, between Normandy and Brittany, has one of the largest tidal ranges in Europe: at high tide, the Mont becomes an island again. These royalty-free photos suit stories about the sea, lighthouses or travel in France, and can be downloaded for free on Pexels.
texte_zh = 夏天，很多法国人会去诺曼底和布列塔尼的海边。这里的海和南法蓝色的地中海完全不同：潮汐很大，雾说来就来，海岸上一座座灯塔守着航道。

    这组照片沿着这片海岸展开：雾海中孤独伫立的 Le Loup 灯塔，格朗维尔岩石海岸上的灯塔，被海浪拍打的礁石。格朗维尔外海的肖塞群岛只能坐船前往，岛上绿荫中有一座金字塔形的石砌地标，礁石上还有一座小屋。最后，照片来到圣米歇尔山修道院的哥特式拱顶与彩窗之下，再到圣马洛。

    圣米歇尔山所在的海湾位于诺曼底与布列塔尼之间，潮差是欧洲最大的之一，涨潮时，圣米歇尔山会重新变成一座岛。这些免版税照片适合用于海洋、灯塔或法国旅行题材的报道，并可在 Pexels 免费下载。
francais_en = le phare = the lighthouse. The word comes from Pharos, the island of the great lighthouse of ancient Alexandria.
    la marée = the tide, from la mer, the sea.
francais_zh = le phare = 灯塔。这个词来自古代亚历山大港外的法罗斯岛（Pharos），岛上曾矗立着著名的亚历山大灯塔。
    la marée = 潮汐，由 la mer（大海）一词变化而来。

