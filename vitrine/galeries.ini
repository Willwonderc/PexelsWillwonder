texte_en = Small but varied, this gallery follows the ways we get around: trains, stations, the metro, cars and roads, in both black-and-white and color images.

    Trains appear here in several forms: a black-and-white aerial view of a railway station, a station platform emptied out during the Covid era, Paris RER carriages caught in a short exposure that stretches their motion into blurred lines, or the calmer, more rural silhouette of a train crossing the Poitou countryside under an open sky. Black and white also returns for two close-up images of an old-fashioned gas pump, worn and faded with a distinctly retro look. Overhead, a yellow helicopter passes in flight, caught in motion against the sky. On the road, two road-trip moments close out the set: wind turbines turning on a hillside during a stop somewhere in Europe, and a fiery sunset seen through the windshield, mid-drive, the steering wheel in silhouette.

