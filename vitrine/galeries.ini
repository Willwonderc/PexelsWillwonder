texte_fr = Cette galerie de lieu associe deux villes de la Charente : Cognac, dont le nom a donné celui de l'eau-de-vie, et Angoulême, bâtie sur un plateau au-dessus de la vallée du même fleuve. À Cognac, la mairie revient à plusieurs reprises, avec son jardin, son drapeau français et sa pierre blanche, sous un ciel dégagé.

