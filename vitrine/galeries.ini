texte_fr = Cette galerie de lieu associe Niort et Poitiers, les deux villes historiques du Poitou, dans les Deux-Sèvres et la Vienne. À Niort, l'église Notre-Dame dresse sa flèche gothique au-dessus des toits et se reflète dans la rivière ; d'autres clochers se découvrent depuis un parc aux couleurs d'automne, près d'un banc de bois. Des canards nagent sous un pont, dans un canal en crue au printemps ; l'hôtel de ville et un bâtiment administratif voisin affichent leurs drapeaux tricolores, et un bas-relief de la Belle Époque orne une façade ancienne.

    Autour de la ville, le Marais poitevin déploie ses canaux bordés de végétation : une barque à quai, des vaches maraîchines au pré, et des reflets de fleurs et de lampadaires dans l'eau calme. En centre-ville, les halles accueillent le marché sous leur verrière, le Port Boinot garde sa tour d'eau, et des sculptures animalières contemporaines croisent piétons et bus sur une place bordée de roses blanches ; une promenade ombragée s'y découvre aussi en noir et blanc.

    À Poitiers, ancienne capitale du Poitou, une rue animée mêle architecture ancienne et moderne et la cathédrale domine la vieille ville ; quelques images portent le nom de « pictave », l'adjectif qui désigne Poitiers, pour un pont, des toits ou un balcon aux volets colorés. Un train traverse la campagne du Poitou alentour. Ces photos libres de droits conviennent pour illustrer le Poitou, le tourisme de proximité ou un blog de voyage, et se téléchargent gratuitement sur Pexels.
texte_en = This place gallery pairs Niort and Poitiers, the two historic towns of the Poitou region, in the Deux-Sèvres and Vienne departments. In Niort, the Notre-Dame church raises its Gothic spire above the rooftops and is mirrored in the river; other church towers appear from a park in autumn colors, near a wooden bench. Ducks swim under a bridge, on a canal swollen in spring; the town hall and a nearby administrative building fly their tricolor flags, and a Belle Époque bas-relief decorates an old façade.

    Around the town, the Marais poitevin wetlands spread their canals lined with vegetation: a boat moored at the water's edge, Maraîchine cattle grazing in the meadow, and reflections of flowers and lamp posts in still water. In the town center, the covered market hall gathers traders under its glass roof, the old Port Boinot district keeps its water tower, and contemporary animal sculptures share a square lined with white roses with pedestrians and a passing bus; a shaded promenade nearby is also shown in black and white.

    In Poitiers, once the capital of Poitou, a busy street mixes old and modern architecture and the cathedral rises above the old town; a few images carry the word “pictave”, the adjective for Poitiers, for a bridge, rooftops or a balcony with colored shutters. A train crosses the surrounding Poitou countryside. These royalty-free photos suit stories about the Poitou region, local tourism or a travel blog, and can be downloaded for free on Pexels.

