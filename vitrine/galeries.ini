texte_fr = Cette galerie de lieu longe la côte entre Normandie et Bretagne, de Granville aux îles Chausey, du Mont-Saint-Michel à Saint-Malo. À Granville et sur la côte voisine de Saint-Planchers, des phares veillent sur les rochers, l'un dans la brume, l'autre sous un ciel nuageux. Aux îles Chausey, un repère de pierre pyramidal émerge de la végétation, et une maison de pêcheur s'accroche au rivage rocheux.

    Le Mont-Saint-Michel apparaît par l'intérieur de son abbaye : arcs gothiques et vitraux, dans une lumière qui souligne la hauteur des voûtes. À Saint-Malo, les remparts et le port se découpent face à la mer, sous un ciel bleu traversé de nuages, et l'église Saint-Vincent laisse filtrer la lumière à travers ses vitraux. Non loin, la butte du Mont-Dol domine les marais qui bordent la baie.

    Ailleurs sur la côte normande, les vagues viennent battre une formation rocheuse, et un bateau glisse près du rivage ; un portrait pris en pleine nature, fleurs et contre-jour, complète la galerie. Ces photos libres de droits conviennent pour illustrer le littoral, le tourisme côtier, un blog de voyage ou un fond d'écran, et se téléchargent librement sur Pexels.
texte_en = This place gallery follows the coast between Normandy and Brittany, from Granville and the Chausey Islands to Mont-Saint-Michel and Saint-Malo. At Granville and along the coast at Saint-Planchers, lighthouses watch over the rocks, one wrapped in mist, the other under a clouded sky. On the Chausey Islands, a pyramidal stone landmark rises out of the vegetation, and a fisherman's house clings to the rocky shore.

    Mont-Saint-Michel is shown from inside its abbey: Gothic arches and stained glass, in a light that draws out the height of the vaulting. At Saint-Malo, the ramparts and harbor stand out against the sea under a blue sky crossed with clouds, and light filters through the stained-glass windows of the Saint-Vincent church. Nearby, the hill of Mont-Dol rises above the marshes that border the bay.

    Further along the Normandy coast, waves break against a rock formation, and a boat glides close to the shore; a portrait taken outdoors, with flowers and backlight, rounds off the gallery. These royalty-free photos suit stories about the coastline, coastal tourism, a travel blog or a wallpaper, and can be freely downloaded on Pexels.

