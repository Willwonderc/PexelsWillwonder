texte_fr = Cette galerie réunit des vues du Pays basque prises à Irun, aux portes de la France, autour de Saint-Sébastien et dans le Guipuscoa, ainsi qu'à Bilbao. À Irun, l'objectif s'attarde sur l'hôtel de ville et son architecture classique, la vieille ville et ses façades colorées, un immeuble rose orné d'un lauburu basque, et deux portes anciennes à la peinture patinée, devant l'une desquelles passe un cycliste. Des murs en pierre disposés en terrasses sont traités en noir et blanc.

    La campagne du Guipuscoa apparaît dans la brume, autour d'un sommet encadré d'arbres et d'un ruisseau moussu entre les rochers. À Bilbao, deux images montrent un autre visage de la région : un site industriel où la vapeur monte au crépuscule, grue à l'appui, et la torchère d'une raffinerie qui domine la côte. Deux portraits de rue complètent la galerie, ceux d'un même homme en casquette blanche et lunettes de soleil, sur un fond flouté en bokeh.

    De l'architecture patrimoniale à l'industrie, en passant par le portrait de rue et le paysage embrumé, ces photos composent un tableau varié du Pays basque espagnol. Elles conviennent pour illustrer un article de voyage, un reportage sur le nord de l'Espagne ou un support consacré à la culture basque et, libres de droits, se téléchargent gratuitement sur Pexels.
texte_en = This gallery brings together views of the Basque Country taken in Irun, on the border with France, around San Sebastián and across Gipuzkoa, as well as in Bilbao. In Irun, the camera lingers on the town hall's classical architecture, the old town's colorful façades, a pink apartment building decorated with a Basque lauburu, and two weathered doors with peeling paint, one of them passed by a cyclist. Terraced stone walls are rendered in black and white.

    The Gipuzkoa countryside appears in the mist, around a peak framed by trees and a mossy creek threading through rocks. Two images from Bilbao show another side of the region: an industrial site with steam rising at dusk, crane in view, and a refinery flare stack overlooking the coast. Two street portraits round out the gallery, both of the same man in a white cap and sunglasses, against a blurred bokeh background.

    From heritage architecture to industry, street portraiture and misty landscape, these photos add up to a varied picture of the Spanish Basque Country. Royalty-free, they suit travel writing, a feature on northern Spain or content about Basque culture, and can be downloaded for free on Pexels.

