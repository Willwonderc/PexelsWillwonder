texte_fr = Cette galerie suit l'eau douce sous toutes ses formes : rivières, lacs, canaux, écluses et marais, avec leurs reflets et leurs berges. Les saisons s'y répondent, du printemps aux couleurs vives à l'automne qui roussit les feuilles.

    À Niort, les flèches gothiques de l'église Notre-Dame se dressent au-dessus de la ville et de la rivière, tandis que des canards traversent un canal en crue au printemps. Plus au sud, à Villandry, une rivière bordée d'une végétation luxuriante passe sous un pont fleuri de géraniums roses, près d'une vieille barque amarrée. Le marais niortais apparaît dans ses canaux étroits, que l'on appelle localement des « airais ». Ailleurs, l'eau se fait plus sauvage : le mécanisme d'une écluse, un ruisseau moussu entre les rochers du Pays basque espagnol, ou des lacs vosgiens du côté de Xonrupt, entre forêt et crêtes voilées de nuages. Quelques images choisissent le noir et blanc : une barque vide abandonnée parmi les feuilles mortes, ou une maison isolée au bord de l'eau, cernée par la forêt.

    Ces photos libres de droits conviennent pour illustrer un article sur l'eau, la pêche, le tourisme fluvial ou la vie des marais, un blog de voyage ou un fond d'écran apaisant. Elles se téléchargent gratuitement sur Pexels.
texte_en = This gallery follows fresh water in every form: rivers, lakes, canals, locks and marshes, with their reflections and their banks. The seasons answer each other here, from spring's bright colors to the rust of autumn leaves.

    In Niort, the Gothic spires of the Notre-Dame church rise above the town and the river, while ducks cross a flooded canal in spring. Further south, in Villandry, a river lined with lush vegetation flows under a bridge decked with pink geraniums, near an old moored boat. The Niort marsh appears in its narrow channels, locally called "airais". Elsewhere the water turns wilder: the machinery of a lock, a mossy stream among the rocks of the Spanish Basque Country, or lakes in the Vosges near Xonrupt, between forest and cloud-veiled ridges. A few images choose black and white: an empty rowboat left among fallen leaves, or a secluded house by the water, hemmed in by forest.

    These royalty-free photos suit stories about water, fishing, river tourism or marshland life, a travel blog or a calming wallpaper. They can be downloaded for free on Pexels.

