texte_fr = Cette galerie tourne presque entièrement autour des jardins du château de Villandry, en Centre-Val de Loire : de larges vues aériennes déploient les parterres de buis taillé et le potager décoratif, où légumes et fleurs composent des motifs géométriques. Le canal qui borde le domaine et le château lui-même, avec ses tours, se reflètent dans un bassin tranquille.

    Plus près, la galerie s'attarde sur des détails : une photo en noir et blanc isole la façade et ses ornements, tandis que des visiteurs flânent dans le potager, les toits et le clocher du village en arrière-plan. D'autres images cadrent de très près les fleurs du domaine — échinops bleus, roses jaune pâle aux pétales ondulés, phlox roses, bégonias — et une vigne aux raisins verts qui court le long d'une pergola.

    Ces images conviennent pour illustrer un article de jardinage ou de patrimoine, un blog de voyage en Val de Loire, un support de cours ou un fond d'écran. Comme toutes les photos de Karl Forterre, elles se téléchargent gratuitement sur Pexels, sans droits à régler.
texte_en = This gallery centers almost entirely on the gardens of the Château de Villandry, in the Centre-Val de Loire region: wide aerial views spread out the clipped box-hedge parterres and the decorative kitchen garden, where vegetables and flowers form geometric patterns. The canal bordering the estate and the château itself, with its towers, are mirrored in a still pool.

    Closer in, the gallery lingers on details: a black-and-white photo isolates the façade and its stonework, while visitors stroll through the kitchen garden with the village rooftops and church spire behind them. Other images move in close on the estate's flowers — blue echinops thistles, pale yellow roses with ruffled petals, pink phlox, begonias — and a grapevine ripening along a pergola.

    These images suit articles on gardening or heritage, a travel blog about the Loire Valley, teaching material or a wallpaper. Like the rest of Karl Forterre's work, they can be downloaded for free on Pexels, with no rights to clear.

