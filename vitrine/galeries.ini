texte_fr = Cette galerie réunit six vues du monument aux Girondins, à Bordeaux, en Gironde. Une sculpture d'ange se déploie sous un ciel bleu, tandis qu'un gros plan s'attarde sur le grain de la pierre et les reliefs du monument. Au pied de l'édifice, la fontaine occupe la moitié des images : l'eau y éclabousse entre les statues, des chevaux et des angelots de bronze peuplent le bassin, une figure couronnée de laurier et tenant un rameau d'olivier s'élève en son centre, et une figure ailée de la Liberté, une chaîne brisée à la main, domine l'ensemble.

    D'un plan large sous le ciel bleu à des gros plans serrés sur le bronze et la pierre, ces photos font le tour de la sculpture monumentale sous plusieurs angles, jouant sur le contraste entre la pierre claire du monument et le bronze sombre de ses statues et de sa fontaine. L'eau qui éclabousse au pied des statues anime plusieurs de ces images et souligne le mouvement des figures sculptées.

    Elles conviennent pour illustrer un article sur le patrimoine de Bordeaux, la sculpture publique ou un guide de voyage en Gironde. Libres de droits, ces images se téléchargent sans frais sur Pexels.
texte_en = This gallery brings together six views of the Monument aux Girondins in Bordeaux, Gironde. An angel sculpture spreads its wings under a blue sky, while a close-up lingers on the grain of the stone and the relief work of the monument. At its base, the fountain fills half the images: water splashes among the statues, bronze horses and cherubs populate the basin, a laurel-crowned figure holding an olive branch rises at its center, and a winged figure of Liberty, a broken chain in hand, dominates the group.

