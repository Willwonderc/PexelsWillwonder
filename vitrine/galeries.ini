texte_fr = De grandes cathédrales aux petites chapelles de village, cette galerie regarde les églises de dehors et de dedans, entre pierre, vitraux et lumière.

    À Niort, les flèches gothiques de l'église Notre-Dame dominent la ville, vues depuis un parc ou depuis la rivière ; en Anjou, la cathédrale Saint-Maurice d'Angers déploie son architecture néoromane. On reconnaît aussi les arches et les vitraux de l'abbaye du Mont-Saint-Michel, la basilique de Nancy, la cathédrale de Poitiers et une petite église romane nichée dans la verdure, à Buzy. En Galice, la façade baroque de la cathédrale de Saint-Jacques-de-Compostelle et ses clochers dominent les toits de la ville. À l'intérieur, l'atmosphère change : cierges dans la pénombre, vitraux ronds ou bleu et rose, retables baroques dorés entre deux fenêtres, statue du Christ dans une niche de pierre. Plusieurs de ces images, prises en pose longue, jouent du flou pour rendre le recueillement plutôt que le décor.

    Ces photos libres de droits conviennent pour illustrer le patrimoine religieux, le pèlerinage, un article de voyage ou un cours d'histoire de l'art ; elles sont librement téléchargeables sur Pexels.
texte_en = From great cathedrals to small village chapels, this gallery looks at churches both outside and in, through stone, stained glass and light.

    In Niort, the Gothic spires of the Notre-Dame church rise above the town, seen from a park or from the river; in Anjou, Angers' Saint-Maurice Cathedral shows its Romanesque Revival architecture. The gallery also includes the arches and stained glass of Mont-Saint-Michel abbey, the basilica of Nancy, Poitiers cathedral and a small Romanesque church tucked into greenery at Buzy. In Galicia, the baroque facade of Santiago de Compostela Cathedral and its bell towers rise above the rooftops of the city. Inside, the mood changes: candles glowing in the dark, round or blue-and-pink stained-glass windows, gilded baroque altarpieces between two windows, a statue of Christ set in a stone niche. Several of these images, shot with long exposures, use blur to convey quiet contemplation rather than decoration.

