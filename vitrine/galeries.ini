# Galeries du site, dans l'ordre d'affichage.
#
# Chaque galerie commence par [identifiant] : il sert d'adresse, n'en changez pas
# une fois le site en ligne. Réglages possibles :
#   type        : theme ou lieu (rangement sur la page d'accueil)
#   titre_fr, titre_en, description_fr, description_en : textes affichés
#   mots        : une photo entre dans la galerie si son titre ou ses mots-clés
#                 anglais contiennent l'un de ces mots (séparés par des virgules)
#   ajouter     : numéros Pexels à inclure en plus, séparés par des virgules
#   retirer     : numéros Pexels à exclure
#   couverture  : numéro de la photo de couverture (sinon la plus récente)
#   bandeau     : numéro de la grande photo affichée derrière le titre de la galerie
#                 (sinon la couverture si elle est en largeur, sinon la première
#                 photo en largeur)

