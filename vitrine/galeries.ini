texte_fr = Cette galerie regroupe des photos en noir et blanc, entre architecture, portraits et paysages. Côté architecture : la façade et les jardins du château de Villandry, l'ensemble de la Laboral Ciudad de la Cultura à Gijón avec son campanile, sa coupole et son grand atrium à colonnes corinthiennes, un dolmen près de Pau, des murs en pierre en terrasses à Irun, en Pays basque espagnol, l'aqueduc de Laval et la tour Montparnasse, à Paris.

