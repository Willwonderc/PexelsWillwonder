texte_fr = Cette galerie suit le chemin de Saint-Jacques-de-Compostelle dans le Béarn, entre sentiers forestiers et haltes dans des églises, aux abords de Pau. Une balise officielle clouée sur un tronc, au bord d'un sentier rocailleux, un chemin bordé de murets de pierre sous les arbres, une canopée qui l'ombrage et un bloc morainique moussu, au pied d'un arbre, jalonnent le parcours.

    Le reste de la galerie se passe à l'intérieur d'édifices religieux, où la lumière est saisie en poses longues et en flous volontaires : un retable baroque doré entre des fenêtres ensoleillées, une lampe votive sur un panneau d'autel sculpté, un vitrail bleu et rose, des cierges commémoratifs et leurs traînées de lumière, une lampe de sanctuaire rouge, et deux vues d'une statue du Christ, l'une nette dans une alcôve de pierre au-dessus de fleurs jaunes, l'autre floutée, bras ouverts.

    Plus que l'architecture de ces églises, ces images cherchent leur pénombre silencieuse et la douceur de leurs lumières. Elles conviennent pour illustrer un article sur la randonnée, le pèlerinage de Compostelle, le patrimoine religieux ou un texte sur le recueillement. Libres de droits, comme toutes les photos de cette galerie, elles se téléchargent gratuitement sur Pexels.
texte_en = This gallery follows the Way of St James through the Béarn, alternating forest trails and stops inside churches, near Pau. An official waymark nailed to a tree trunk beside a rocky path, a trail lined with low stone walls under the trees, a shading canopy, and a moss-covered boulder of glacial moraine at the foot of a tree mark out the route.

    The rest of the gallery takes place inside churches, where light is captured through long exposures and deliberate blur: a gilded baroque altarpiece between sunlit windows, a votive lamp on a carved altar panel, a blue and pink stained-glass window, memorial candles and their trailing light, a red sanctuary lamp, and two views of a statue of Christ, one sharp, in a stone alcove above yellow flowers, the other blurred, arms outstretched.

    More than the architecture of these churches, the images chase their quiet half-light and soft glow. They suit stories about hiking, the pilgrimage to Compostela, religious heritage or a piece on stillness and reflection. Royalty-free, like every photo in this gallery, they can be downloaded for free on Pexels.

