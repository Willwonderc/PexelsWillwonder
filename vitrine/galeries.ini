mots = galicia, galiza, lugo, ribadeo, santiago de compostela, cathedrals beach, as catedrais
ajouter = 39517000, 39516999
couverture = 39564918
texte_fr = Cette galerie parcourt la Galice, dans le nord-ouest de l'Espagne, de Saint-Jacques-de-Compostelle jusqu'à la côte de Ribadeo. À Saint-Jacques, la façade baroque de l'Obradoiro, à la cathédrale, avec ses clochers et ses flèches, et une statue couronnée d'une étoile qui domine les toits de la vieille ville, composent le volet patrimonial de la galerie, avec un gros plan sur une architecture plateresque, des balustrades de pierre bordées de lampadaires anciens, et une scène prise sur le vif dans un jardin ensoleillé, entre fleurs roses et fontaine.

    Vers l'est, la côte offre la plage des Cathédrales, près de Ribadeo : des arches et des gorges taillées dans la roche, des cormorans rassemblés sur la falaise, et, en noir et blanc, des barques qui glissent sur une mer étale. Un peu plus à l'ouest, sur la même côte, un feu d'artifice illumine le ciel nocturne au-dessus de Foz.

    Dans l'arrière-pays, autour de Lugo, une brume bleutée noie des coteaux plantés d'eucalyptus et des éoliennes se dressent en haut des collines ; des maisons mitoyennes aux toits de tuiles rouges et aux bougainvilliers composent un autre visage de la région. La nuit, la Voie lactée et la galaxie d'Andromède éclairent le ciel de Galice, où une éclipse de Soleil est aussi captée en plusieurs étapes. Ces photos libres de droits conviennent pour illustrer un carnet de voyage, un article sur l'Espagne ou le nord-ouest ibérique, l'astronomie ou la géologie côtière ; elles se téléchargent gratuitement sur Pexels.
texte_en = This gallery travels across Galicia, in northwestern Spain, from Santiago de Compostela to the coast at Ribadeo. In Santiago, the baroque Obradoiro façade of the cathedral, with its bell towers and spires, and a star-crowned statue rising above the rooftops of the old town, make up the gallery's heritage side, along with a close-up of plateresque architecture, stone balustrades lined with old-fashioned lamps, and a candid moment in a sunlit garden, among pink flowers and a fountain.

    To the east, the coast offers Cathedrals Beach, near Ribadeo: arches and gorges cut into the rock, cormorants gathered on the cliffs, and, in black and white, boats gliding across a glassy sea. A little further west along the same coast, fireworks light up the night sky over the town of Foz.

    Inland, around Lugo, blue-tinted mist engulfs hillsides planted with eucalyptus and wind turbines stand along the hilltops; terraced houses with red tile roofs and bougainvillea show another side of the region. At night, the Milky Way and the Andromeda Galaxy light up the Galician sky, where a solar eclipse is also captured in several stages. These royalty-free photos suit a travel journal, a feature on Spain or northwestern Iberia, astronomy or coastal geology, and can be downloaded for free on Pexels.

