texte_fr = Cette galerie suit le ciel dans toutes ses humeurs : nuages moutonneux, parfois saisis au fisheye, dégradés de bleu et de rose, ciel bas et chargé au-dessus d'un village ou d'un champ. Le soleil s'y lève sur une éolienne et sur un champ de blé, se couche sur une vache vosgienne au pré, et perce en rayons obliques entre les toits d'une maison.

    D'autres images situent ces ciels dans des lieux plus habités : un clocher se détache sur un coucher de soleil, des antennes et des cheminées dessinent leur silhouette sur un crépuscule pastel, une soirée en plein air s'embrase sous un ciel rouge et noir, et l'Atlantique s'étend jusqu'à l'horizon dans des tons orangés. Deux images de road trip montrent le ciel vu depuis une voiture : un coucher de soleil flamboyant à travers le pare-brise, et des amis installés sur une colline pour regarder tomber le jour.

    De l'article de blog au fond d'écran en passant par une publication sur les réseaux sociaux, ces ciels trouvent toujours un usage. Ils sont libres de droits et se récupèrent gratuitement sur Pexels.
texte_en = This gallery follows the sky through all its moods: fluffy clouds, sometimes caught through a fisheye lens, gradients of blue and pink, a low, heavy sky over a village or a field. The sun rises over a wind turbine and a wheat field, sets behind a cow grazing in a Vosges meadow, and breaks in low rays between the roofs of a house.

    Other images place these skies in more built-up settings: a bell tower stands out against a sunset, antennas and chimneys silhouette themselves against a pastel dusk, an open-air evening glows under a red and black sky, and the Atlantic stretches to the horizon in shades of orange. Two road-trip shots show the sky from inside a car: a fiery sunset through the windshield, and friends settled on a hilltop to watch the day end.

    From a blog post to a wallpaper to a social media update, these skies always find a use. They are royalty-free and free to pick up on Pexels.

