texte_fr = Cette galerie s'attarde sur les sous-bois : troncs, racines et souches, mousse et lichen sur la pierre, jeux de lumière et de contre-jour entre les branches. Les saisons s'y succèdent, du bourgeon printanier aux feuillages denses de l'été jusqu'aux couleurs et aux feuilles tombées de l'automne ; quelques images passent en noir et blanc, comme celle d'une maison isolée au bord d'une rivière, cernée par la forêt.

    Certains lieux s'y reconnaissent : un chemin de terre bordé d'arbres à Moyemont, en été ; un parc de Niort, ses couleurs d'automne et la cathédrale en arrière-plan ; des berges de rivière où des passerelles et des pontons de bois traversent la végétation. Près de Pau, dans les Pyrénées-Atlantiques, une étape du chemin de Saint-Jacques-de-Compostelle serpente sous les arbres : un balisage officiel sur un sentier rocailleux, un tronc couvert de lierre, un lit de ruisseau à sec entre les pierres, une canopée qui ombrage le sentier.

    Utiles pour illustrer la nature, la randonnée ou un fond d'écran, ces images restent libres de droits : elles se téléchargent gratuitement sur Pexels, comme l'ensemble du travail de Karl Forterre.
texte_en = This gallery lingers in the woods: trunks, roots and stumps, moss and lichen on stone, plays of light and backlight between the branches. The seasons follow one another, from spring buds to the dense green of summer to the colors and fallen leaves of autumn; a few images turn to black and white, including one of a secluded house by a river, hemmed in by forest.

    Some places are recognisable: a tree-lined dirt road in Moyemont in summer; a park in Niort, its autumn colors and the cathedral in the background; riverbanks where wooden footbridges and boardwalks cross through the vegetation. Near Pau, in the Pyrénées-Atlantiques, a stage of the Way of St James winds beneath the trees: an official waymark on a rocky trail, a log wrapped in ivy, a dry creek bed between the stones, a canopy shading the path.

    Useful for stories about nature, hiking or a wallpaper, these images remain royalty-free: they can be downloaded for free on Pexels, like the rest of Karl Forterre's work.

