couverture = 34894953
texte_fr = Cette galerie longe les côtes de la Manche et de l'Atlantique. En Normandie, des phares veillent sur le rivage — le Loup dans la brume, celui de Granville sous un ciel nuageux, celui de Saint-Planchers au milieu des rochers — et l'île de Chausey montre son repère pyramidal de pierre et une maison isolée au bord de l'eau. Une barque abandonnée, photographiée en noir et blanc, et une mouette posée sur un mur complètent ce littoral, jusqu'à Saint-Malo, en Bretagne.

    Plus au sud, la galerie passe en Espagne. Près de Bilbao, au Pays basque, la torchère d'une raffinerie domine la côte. En Galice, près de Ribadeo, les arches et les gorges de la plage des Cathédrales, taillées dans une roche feuilletée, plongent dans une eau turquoise ; des cormorans se rassemblent sur des rochers striés de guano, et de petits bateaux de pêche et de plongée traversent une mer d'huile, saisis en noir et blanc.

    Du carnet de voyage au cours de géologie, ces vues du littoral trouvent leur usage ; libres de droits, elles se téléchargent gratuitement sur Pexels.
texte_en = This gallery follows the coastline of the English Channel and the Atlantic. In Normandy, lighthouses watch over the shore — Le Loup in the mist, the one at Granville under a cloudy sky, the one at Saint-Planchers among the rocks — and Chausey Island shows off its pyramidal stone landmark and a house standing alone by the water. An abandoned rowing boat, shot in black and white, and a seagull perched on a wall complete this stretch of coast, on to Saint-Malo, in Brittany.

    Further south, the gallery moves into Spain. Near Bilbao, in the Basque Country, a refinery flare stack rises above the coast. In Galicia, near Ribadeo, the arches and gorges of the Cathedrals Beach, cut into layered rock, plunge into turquoise water; cormorants gather on cliffs streaked with guano, and small fishing and diving boats cross a glassy sea, captured in black and white.

    From a travel journal to a geology class, these coastal views find their use; royalty-free, they can be downloaded for free on Pexels.

