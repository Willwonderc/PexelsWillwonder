texte_fr = Cette galerie de lieu traverse Paris par ses monuments et ses scènes de rue. La tour Eiffel, photographiée dans un esprit vintage, domine toujours la capitale ; non loin, la tour Montparnasse perce un ciel chargé de nuages, saisie en contre-plongée depuis la rue. À l'intérieur de Notre-Dame, les vitraux et l'architecture gothique rappellent la vocation du lieu, tandis que la façade de pierre blanche du palais Garnier, l'opéra de Paris, se détache sous une lumière franche.

    Le quotidien parisien s'invite aussi dans la galerie : une terrasse animée près de la Rotonde, la célèbre brasserie de Montparnasse, un bar dont la vitrine de bijoux brille le soir venu, un café-restaurant éclairé de lanternes. Un immeuble haussmannien montre ses balcons filants et ses toits en zinc, tandis qu'une passante sourit non loin du Louvre, dans la foule des visiteurs. Le RER traverse une station dans un flou de vitesse, et le métro file sous la tour Montparnasse.

    Ces vues mêlent ainsi les grands monuments et les instants de vie ordinaire, en couleur comme en noir et blanc, entre jour et soirée. Ces photos libres de droits conviennent pour illustrer Paris, le tourisme urbain, un article de blog ou une présentation ; Pexels permet de les télécharger gratuitement.
texte_en = This place gallery moves through Paris by way of its landmarks and street scenes. The Eiffel Tower, shot with a vintage feel, still dominates the capital; nearby, the Tour Montparnasse skyscraper cuts into a cloudy sky, seen from below looking up. Inside Notre-Dame, the stained-glass windows and Gothic architecture recall the building's purpose, while the white stone façade of the Palais Garnier, the Paris opera house, stands out in bright light.

    Everyday Paris finds its way into the gallery too: a busy terrace near La Rotonde, the well-known Montparnasse brasserie, a bar whose jewellery window glows after dark, a café-restaurant lit by lanterns. A Haussmannian building shows off its long balconies and zinc roofs, while a passer-by smiles not far from the Louvre, among the crowds of visitors. The RER crosses a station in a blur of speed, and the metro runs beneath the Tour Montparnasse.

    These views mix major landmarks with ordinary moments, in color and in black and white, from daytime into evening. These royalty-free photos suit stories about Paris, city tourism, a blog post or a presentation; Pexels makes them free to download.

