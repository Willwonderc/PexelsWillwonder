texte_fr = Cette galerie est consacrée à Gijón, ville côtière des Asturies, autour de l'Universidad Laboral, aussi nommée dans les images Laboral Ciudad de la Cultura. Sa tour et sa coupole émergent au-dessus des arbres et des toits modernes, sa silhouette se détache sous un ciel nuageux, et son campus se découvre depuis le terrain de sport. À l'intérieur, un grand atrium à colonnes corinthiennes sous un toit de verre et une colonnade vue en contre-plongée donnent la mesure de l'édifice ; une bibliothèque moderne aux étagères de verre en dit la vocation actuelle, tournée vers l'enseignement.

    La majorité de ces images sont en noir et blanc, ce qui accentue la pierre et les ciels chargés au-dessus du complexe. La galerie s'ouvre aussi sur d'autres coins de Gijón : le clocher et l'abside à coupole d'une église historique, et une villa rouge et blanche sur un coteau boisé, cadrée au téléobjectif.

    Entre architecture monumentale et patrimoine religieux, ces photos libres de droits conviennent pour illustrer l'architecture espagnole, un article sur les Asturies ou un carnet de voyage, et se téléchargent gratuitement sur Pexels.
texte_en = This gallery is devoted to Gijón, a coastal city in Asturias, centered on the Universidad Laboral, also named in the images as Laboral Ciudad de la Cultura. Its tower and dome rise above trees and modern rooftops, its outline stands out under cloudy skies, and its campus can be seen from the sports field. Inside, a grand atrium of Corinthian columns beneath a glass roof, and a colonnade seen from below, give a sense of the building's scale; a modern library with glass shelving hints at its current purpose, turned toward education.

    Most of these images are in black and white, which brings out the stone and the heavy skies above the complex. The gallery also takes in other corners of Gijón: the bell tower and domed apse of a historic church, and a red-and-white villa on a wooded hillside, framed with a telephoto lens.

    Between monumental architecture and religious heritage, these royalty-free photos suit stories about Spanish architecture, a feature on Asturias or a travel journal, and can be downloaded for free on Pexels.

