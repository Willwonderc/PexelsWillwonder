texte_en = From a village town hall to the monuments of major cities, this gallery brings together facades, bridges, doors and architectural details photographed in France and Spain. Many of these images choose black and white, which brings out the stone and the heavy skies.

    In France, the town halls of Niort, Cognac and Angoulême show off their facades and flags; at Laval, an aqueduct crosses the river. In Toulouse, the dome of La Grave and the Pont Saint-Pierre light up at night. In Bordeaux, the Monument aux Girondins displays its angels, bronze horses and fountain. Paris contributes the Eiffel Tower, the Tour Montparnasse and buildings in the Haussmannian style. In the Loire Valley, the Château de Villandry shows its detailed facade and its bridge decked with geraniums. In Spain, the Basque town of Irun lines up a classic town hall, colorful lanes and a pink building marked with a lauburu; in Galicia, terraced houses with tiled roofs are covered in bougainvillea; near Pau, a visitor looks at a dolmen. In Gijón, in Asturias, the former Universidad Laboral spreads out its towers, dome and stone colonnades, in color and in black and white.

    These royalty-free photos suit stories about heritage, travel, a history or architecture course, a website or a presentation, and are available to download for free on Pexels.

