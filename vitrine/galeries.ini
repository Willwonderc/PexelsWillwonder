texte_fr = Cette galerie regarde les fleurs de très près, en macro, avec de larges flous d'arrière-plan. Les violettes y reviennent souvent, étudiées presque comme un motif en symétrie, à côté de roses dans toutes les teintes — blanches, roses, jaunes, rouges —, de pétunias, de cosmos, d'hortensias, de bégonias et d'un chardon aux boules bleutées. Une abeille butine l'une de ces fleurs ; ailleurs, un champ de fleurs sauvages blanches et jaunes s'étend à perte de vue.

    Certaines images situent ce travail de macro dans des lieux précis. Dans les jardins du château de Villandry, en Val de Loire, l'objectif isole des échinops bleus, des roses jaune pâle aux pétales ondulés, du phlox rose et des bégonias, avant de s'arrêter sur des raisins verts mûrissant le long d'une pergola. Près de Buzy, dans les Pyrénées-Atlantiques, la macro quitte les fleurs pour la mousse et le lichen sur la roche, une liane enroulée et un rocher couvert de fougères.

    Elles conviennent pour illustrer le jardinage, la botanique ou un blog, aussi bien qu'à servir de fond d'écran. Libres de droits, ces photos macro se téléchargent gratuitement sur Pexels.
texte_en = This gallery looks at flowers in extreme close-up, with wide, blurred backgrounds. Violets return often, studied almost as a pattern in symmetry, alongside roses in every shade — white, pink, yellow, red —, petunias, cosmos, hydrangeas, begonias and a thistle with blue globe-shaped flowers. A bee works one of the blooms; elsewhere, a field of white and yellow wildflowers stretches into the distance.

    Some images place this macro work in specific settings. In the gardens of the Château de Villandry, in the Loire Valley, the lens isolates blue echinops thistles, pale yellow roses with ruffled petals, pink phlox and begonias, before settling on green grapes ripening along a pergola. Near Buzy, in the Pyrénées-Atlantiques, the macro work turns from flowers to moss and lichen on rock, a looped vine and a fern-covered boulder.

    They suit stories about gardening, botany or a blog, and work just as well as a wallpaper. Royalty-free, these macro photos can be downloaded for free on Pexels.

