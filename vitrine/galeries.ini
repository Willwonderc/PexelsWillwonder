texte_fr = Cette galerie parcourt la campagne : champs de blé et de maïs, bottes de foin, vignes derrière des piquets de bois, chemins bordés de haies et de murets. On y croise aussi une vie plus quotidienne — un chat de ferme, une silhouette au milieu de la végétation, un village niché dans les collines verdoyantes de Bourgogne-Franche-Comté, la pluie sur un paysage d'automne.

    Plusieurs régions s'y succèdent. Dans les Vosges, des villages de montagne serrés sur leurs crêtes voisinent avec les ruines d'une ancienne usine gagnée par la forêt ; dans le Poitou, un train traverse un paysage rural. Autour de Pau et de la vallée d'Ossau, dans les Pyrénées-Atlantiques, des villages nichés dans la vallée apparaissent sous des sommets tantôt ensoleillés, tantôt embrumés, entre pâturages clos de barrières de bois et forêts aux tons pastel ; plus au sud, dans le Gipuzkoa basque, un sommet émerge de la brume. En Galice, des éoliennes dominent des collines de bruyère, un pin isolé s'accroche à un affleurement rocheux, et une brume bleutée glisse sur les coteaux d'eucalyptus, près de Lugo.

    Ces scènes de campagne conviennent pour illustrer la vie rurale, un carnet de voyage ou l'agriculture. Toutes ces photos sont libres de droits et se téléchargent sans frais sur Pexels.
texte_en = This gallery moves through the countryside: fields of wheat and corn, hay bales, vines behind wooden stakes, lanes lined with hedges and low stone walls. Everyday life appears too — a farm cat, a figure among the greenery, a village tucked into the green hills of Bourgogne-Franche-Comté, rain over an autumn landscape.

    Several regions follow one another. In the Vosges, mountain villages huddled on their ridges sit alongside the ruins of an old factory reclaimed by the forest; in the Poitou region, a train crosses a rural landscape. Around Pau and the Ossau Valley, in the Pyrénées-Atlantiques, villages nestled in the valley appear beneath peaks that are sometimes sunlit, sometimes hazy, between pastures fenced with wooden rails and forests in pastel tones; further south, in the Basque Gipuzkoa hills, a summit rises out of the mist. In Galicia, wind turbines stand on heathland hills, a lone pine clings to a rocky outcrop, and blue mist drifts over eucalyptus-covered slopes near Lugo.

    These countryside scenes suit stories about rural life, a travel journal or farming. All of them are royalty-free and free to download on Pexels.

