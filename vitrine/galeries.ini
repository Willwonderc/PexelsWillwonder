texte_fr = Cette galerie de lieu parcourt l'est de la France, des lacs vosgiens à Nancy et à Obernai, en Alsace. Autour de Xonrupt et du lac de Longemer, les crêtes des Vosges se reflètent dans l'eau, une chapelle se détache sous un ciel changeant, et un rameur traverse un lac digne d'une carte postale. Plus haut, un village vosgien s'accroche au flanc de la montagne sous des nuages bas, et une vache de race vosgienne broute dans un pré traversé par la lumière du soir.

    À Nancy, la basilique dresse ses tours de pierre, tandis qu'à Obernai, les maisons à colombages, les balcons de bois et les terrasses de restaurant gardent le caractère ancien de la ville alsacienne. Ailleurs, un clocher de pierre se découpe sous un ciel bleu intense et une vue prise depuis un train longe une église de village.

    Des bonbons vosgiens, spécialité sucrée de la région, ferment ce tour d'horizon. Ces photos libres de droits conviennent pour illustrer les Vosges, l'Alsace et la Lorraine, la montagne ou un support de cours de géographie ; elles sont libres de téléchargement sur Pexels.
texte_en = This place gallery travels across eastern France, from the lakes of the Vosges mountains to Nancy and to Obernai in Alsace. Around Xonrupt and Lake Longemer, the Vosges ridges are mirrored in the water, a chapel stands out under a changing sky, and a rower crosses a lake worthy of a postcard. Higher up, a Vosges village clings to the mountainside under low cloud, and a Vosgienne cow grazes in a meadow lit by the evening sun.

    In Nancy, the basilica raises its stone towers, while in Obernai, half-timbered houses, wooden balconies and restaurant terraces keep the old Alsatian town's character. Elsewhere, a stone church tower stands out against a deep blue sky and a view taken from a train runs past a village church.

    Vosges sweets, a local speciality, close out this tour. These royalty-free photos suit stories about the Vosges, Alsace and Lorraine, mountain scenery or a geography lesson; they are free to download on Pexels.
