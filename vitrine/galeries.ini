texte_fr = Cette galerie réunit des chats, des chiens, des chevaux, des oiseaux et des animaux de ferme, la plupart photographiés en France. Côté ferme : une vache charolaise dans un champ boueux de Bourgogne-Franche-Comté, une blonde d'Aquitaine au pré dans les Pyrénées-Atlantiques, une vosgienne éclairée d'une traînée de lumière dans un pré des Vosges, une vache et son veau, et des vaches maraîchines dans un marais. Deux chevaux bais se reposent à l'ombre d'un pâturage des Pyrénées-Atlantiques.

    Côté oiseaux : des moineaux domestiques et une pie en gros plan, des mouettes sur un mur de pierre ou perchées sur une croix, des pigeons sur un marché, des canards colverts nageant dans un canal en crue à Niort, et des cormorans rassemblés sur une falaise striée de guano, près de Ribadeo, en Galice. S'y ajoutent plusieurs chats, dont des portraits d'un chat prénommé Plum, et deux Border Collies au pelage noir et blanc photographiés dans des feuillages ; une partie de ces images est en noir et blanc.

    Cette galerie convient pour illustrer un site ou un blog animalier, un article sur la vie à la campagne, un support pédagogique ou une publication sur les réseaux sociaux. Comme toutes les photos de Karl Forterre, elles sont libres de droits et se téléchargent gratuitement sur Pexels.
texte_en = This gallery brings together cats, dogs, horses, birds and farm animals, most of them photographed in France. On the farm side: a Charolais cow in a muddy field in Bourgogne-Franche-Comté, a Blonde d'Aquitaine cow grazing in the Pyrénées-Atlantiques, a Vosgienne cow lit by a trail of light in a Vosges meadow, a cow with her calf, and Maraîchine cattle standing in a marsh. Two bay horses rest in the shade of a pasture in the Pyrénées-Atlantiques.

    On the bird side: house sparrows and a magpie in close-up, seagulls on a stone wall or perched on a cross, pigeons in a market, mallard ducks swimming in a flooded canal in Niort, and cormorants gathered on a guano-streaked cliff near Ribadeo, in Galicia. The gallery also includes several cats, including portraits of a cat named Plum, and two black-and-white Border Collies photographed among foliage; some of these images are in black and white.

    This gallery suits an animal-themed website or blog, an article on country life, teaching material, or a social media post. Like all of Karl Forterre's photos, they are royalty-free and can be downloaded for free on Pexels.

