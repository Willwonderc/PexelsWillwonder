texte_fr = Cette galerie réunit des photos de nuit prises au fil des années, en France et en Espagne. La Voie lactée s'y déploie au-dessus d'une ligne d'arbres, puis au-dessus de la campagne galicienne, près de Lugo, où l'on distingue aussi la galaxie d'Andromède. La Lune y prend plusieurs visages : un fin croissant dans un dégradé de crépuscule, une pleine lune qui se lève derrière des cheminées, un pin silhouetté dans une brume éclairée par la lune, ou des clichés en noir et blanc au grain marqué. Au-dessus des toits, un croissant de lune s'accroche à une antenne de télévision, et une pose longue trace le mouvement des étoiles dans le ciel.

    Une autre partie suit, étape par étape, l'éclipse totale de Soleil du 12 août 2026, observée depuis la Galice : le croissant solaire qui s'amincit peu à peu, puis la couronne solaire révélée pendant la totalité, et la silhouette d'une personne qui suit le phénomène près d'une voiture, saisie en noir et blanc.

    Libres de droits, ces vues du ciel conviennent à un article sur l'éclipse de 2026, à un cours d'astronomie ou à un fond d'écran ; il suffit de les télécharger sur Pexels, sans frais ni crédit obligatoire.
texte_en = This gallery brings together night photos taken over several years, in France and in Spain. The Milky Way stretches above a line of trees, then over the Galician countryside near Lugo, where the Andromeda Galaxy can also be made out. The Moon takes on several guises: a thin crescent in a gradient dusk sky, a full moon rising behind rooftop chimneys, a pine tree silhouetted in moonlit mist, or grainy black-and-white frames. Above rooftops, a crescent moon catches on a television antenna, and one long exposure traces the stars' movement across the sky.

    Another part follows, stage by stage, the total solar eclipse of 12 August 2026, seen from Galicia: the solar crescent narrowing little by little, then the solar corona revealed during totality, and the silhouette of a person following the event near a car, captured in black and white.

    Royalty-free, these sky views suit an article on the 2026 eclipse, an astronomy class or a wallpaper; downloading them from Pexels costs nothing and needs no credit.

