texte_fr = Cette galerie regarde la ville de plain-pied et depuis ses toits : rues, places, terrasses et art urbain, en France comme en Espagne.

    À Niort, un piéton croise des sculptures de street art et un bus passe devant des roses blanches encadrant des figures animalières, non loin du parc dominé par le clocher de l'église. Poitiers montre une rue animée où se mêlent architecture ancienne et moderne, Saint-Malo son port sur la côte bretonne, et Villandry une ruelle étroite entre maisons de pierre. En Espagne, la vieille ville d'Irun aligne des façades colorées d'architecture basque traditionnelle, tandis que les toits de Pau se devinent, voilés de brume, depuis une colline en fin d'après-midi. Ailleurs, la ville se regarde d'en haut ou à la nuit tombée : silhouettes de cheminées et d'antennes sur un ciel pastel, pleine lune se levant derrière les toits, fumées d'un site industriel au crépuscule près de Bilbao, feu d'artifice au-dessus de Foz, en Galice. Aux terrasses de café, entre amis, et sur un mur, un graffiti « je t'aime » peint en violet complètent cette vie de rue.

    Ces photos libres de droits conviennent pour illustrer le tourisme urbain, un blog de voyage, un article sur la vie de quartier ou une présentation, et se téléchargent gratuitement sur Pexels.
texte_en = This gallery looks at the city at street level and from its rooftops: streets, squares, café terraces and street art, in France and in Spain.

    In Niort, a pedestrian passes street-art sculptures and a bus drives by white roses framing animal figures, not far from the park overlooked by the church spire. Poitiers shows a busy street mixing old and modern architecture, Saint-Malo its harbor on the Brittany coast, and Villandry a narrow lane between stone houses. In Spain, the old town of Irun lines up colorful facades of traditional Basque architecture, while the rooftops of Pau appear, veiled in haze, from a hillside in the late afternoon. Elsewhere the city is seen from above or after dark: chimney and antenna silhouettes against a pastel sky, a full moon rising behind rooftops, smoke from an industrial site at dusk near Bilbao, fireworks over Foz, in Galicia. On café terraces among friends, and on a wall, a purple "je t'aime" graffiti round off this street life.

