texte_fr = Cette galerie rassemble des scènes de manifestations et de rassemblements militants photographiées en France. Le rouge y domine : drapeaux rouges brandis à bout de bras, poings levés, banderoles syndicales, dans des cortèges où se croisent jeunes militants et figures plus âgées. Plusieurs images reprennent ce même motif du drapeau rouge, saisi lors de rassemblements distincts, avec à chaque fois une foule dense et de nombreux jeunes participants.

    Une autre photo montre le passage d'un cortège motorisé accompagnant un élu, en marge d'un rassemblement. La plupart des clichés sont en couleur, pris au plus près de la foule, dans l'esprit du reportage ; l'un d'eux, en noir et blanc, cadre un homme aux prises avec un drapeau, en pleine ville. Les visages sont rarement identifiables : l'accent porte sur le geste, le symbole et le nombre plutôt que sur les personnes photographiées.

    Ces photos conviennent pour illustrer un article sur les mouvements sociaux, la vie syndicale ou politique en France, un support de cours d'éducation civique ou d'histoire contemporaine, ou un dossier de presse. Libres de droits, elles se téléchargent gratuitement sur Pexels.
texte_en = This gallery gathers scenes from protests and activist rallies photographed in France. Red dominates: red flags held aloft, raised fists, union banners, in marches where young activists mix with older participants. Several images return to this same red-flag motif, caught at distinct gatherings, each time amid a dense crowd with many young participants.

    Another photo shows a motorcade carrying an elected official passing by the edge of a rally. Most of the shots are in color, taken close to the crowd, in a reportage style; one, in black and white, frames a man caught up with a flag in the middle of the city. Faces are rarely identifiable: the focus falls on gesture, symbol and numbers rather than on the people photographed.

    These photos suit an article on social movements, union or political life in France, a civic education or contemporary history course, or a press feature. Royalty-free, they can be downloaded for free on Pexels.

