# Galeries du site, dans l'ordre d'affichage.
#
# Chaque galerie commence par [identifiant] : il sert d'adresse, n'en changez pas
# une fois le site en ligne. Réglages possibles :
#   type        : theme ou lieu (rangement sur la page d'accueil ; la galerie de lieu
#                 d'une photo est aussi le parent de son fil d'Ariane)
#   titre_fr, titre_en, description_fr, description_en : textes affichés
#   mots        : une photo entre dans la galerie si son titre, ses mots-clés anglais
#                 ou ses mots-clés Pexels (fiche de suivi de releves/) contiennent l'un
#                 de ces mots (séparés par des virgules)
#   ajouter     : numéros Pexels à inclure en plus, séparés par des virgules
#   retirer     : numéros Pexels à exclure
#   couverture  : numéro de la photo de couverture (sinon la plus récente)
#   texte_fr, texte_en : texte de présentation, de 150 à 300 mots, affiché sous les
#                 photos. Décaler les lignes suivantes de quelques espaces ; une ligne
#                 vide sépare deux paragraphes.
#
# Les photos en ligne ont été rangées une à une en septembre 2026 : les lignes ajouter
# et retirer gardent ce classement, que les mots seuls ne donneraient pas. Chaque photo
# publiée doit figurer dans au moins une galerie. Une galerie ne s'affiche qu'à partir
# de 4 photos (réglage galerie_min de site.ini).

