texte_fr = De la mairie d'un village aux monuments des grandes villes, cette galerie réunit façades, ponts, portes et détails d'architecture photographiés en France et en Espagne. Beaucoup de ces images choisissent le noir et blanc, qui accuse la pierre et les ciels chargés.

    En France, les mairies de Niort, de Cognac et d'Angoulême affichent leurs façades et leurs drapeaux ; à Laval, un aqueduc franchit la rivière. À Toulouse, le dôme de la Grave et le pont Saint-Pierre s'illuminent la nuit. À Bordeaux, le monument aux Girondins déploie ses anges, ses chevaux de bronze et sa fontaine. Paris apporte la tour Eiffel, la tour Montparnasse et des immeubles à la façon haussmannienne. Dans le Val de Loire, le château de Villandry montre sa façade détaillée et son pont fleuri de géraniums. En Espagne, la ville basque d'Irun aligne une mairie classique, des ruelles colorées et un immeuble rose orné d'un lauburu ; en Galice, des maisons mitoyennes aux toits de tuiles se couvrent de bougainvilliers ; près de Pau, un visiteur observe un dolmen. À Gijón, dans les Asturies, l'ancienne Universidad Laboral déploie ses tours, sa coupole et ses colonnades de pierre, en couleur comme en noir et blanc.

