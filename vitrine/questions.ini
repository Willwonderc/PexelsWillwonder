# Questions fréquentes : page /questions-frequentes/ (anglais : /en/faq/, chinois :
# /zh/faq/), dans l'ordre de ce fichier. Elles sont aussi reprises dans les données
# structurées de la page (FAQPage) et dans les fichiers llms.txt lus par les assistants IA :
# des réponses courtes, exactes et complètes sont celles qu'ils citent le plus volontiers.
#
# Chaque question commence par [identifiant] (minuscules, sans espaces ni accents) : il
# sert d'ancre, par exemple /questions-frequentes/#licence. Réglages :
#   question_fr, question_en, question_zh : la question
#   reponse_fr, reponse_en, reponse_zh    : la réponse. Décaler les lignes suivantes de
#                 quelques espaces ; une ligne vide sépare deux paragraphes.
# Sans traduction chinoise, la page chinoise reprend l'anglais.
#
# Dans les réponses :
#   [texte](adresse) fait un lien. L'adresse est complète (https://…, mailto:…), ou
#     désigne une page du site, dans la langue de la page : accueil, galeries, series,
#     apropos, utiliser, faq, flux (flux RSS, sans version chinoise), pexels (profil
#     Pexels), galerie:<identifiant>, serie:<identifiant>, photo:<numéro>, et au besoin
#     une ancre : apropos#usages.
#   {photos}, {galeries} : nombres de photos et de galeries du site ;
#   {vues}, {telechargements} : chiffres Pexels des derniers relevés (releves/) ;
#   {lieux} : les galeries de lieux ; {series} : les séries ; {sites} : les sites qui ont
#     utilisé des photos (usages.csv, type « site »).
#   Une question dont un de ces éléments est vide (aucun usage signalé, par exemple)
#   n'est pas affichée.

[qui]
question_fr = Qui est Karl Forterre ?
question_en = Who is Karl Forterre?
question_zh = Karl Forterre 是谁？
reponse_fr = Karl Forterre est un photographe et auteur français, installé à Niort. Il photographie les jardins, l'architecture, les paysages et le ciel, en France et en Espagne. Toutes ses photos sont publiées sur [Pexels](pexels), où elles totalisent {vues} vues et {telechargements} téléchargements ; ce site en présente {photos}.

    Il a aussi publié deux livres à la Société des Éditions du Poitou, Darshan (2022) et L'histoire du petit Théo (2023), et consacré son mémoire de master à la médiation auctoriale des sites d'auteurs (Université de Poitiers, 2023). Ses livres et ses créations graphiques sont présentés sur [karlforterre.fr](https://karlforterre.fr/).
reponse_en = Karl Forterre is a French photographer and writer based in Niort. He photographs gardens, architecture, landscapes and the sky, in France and Spain. All his photos are published on [Pexels](pexels), where they have been viewed {vues} times and downloaded {telechargements} times; this site presents {photos} of them.

    He has also published two books with the Société des Éditions du Poitou, Darshan (2022) and L'histoire du petit Théo (2023), and devoted his master's thesis to authorial mediation on authors' websites (University of Poitiers, 2023). His books and graphic work are presented on [karlforterre.fr](https://karlforterre.fr/).
reponse_zh = Karl Forterre 是一位法国摄影师和作家，现居法国尼奥尔（Niort）。他拍摄法国和西班牙的花园、建筑、风光与天空。他的所有照片都发布在 [Pexels](pexels) 上，累计浏览 {vues} 次、下载 {telechargements} 次；本站展示了其中的 {photos} 张。

    他还在 Société des Éditions du Poitou 出版社出版了两本书：《Darshan》（2022年）和《L'histoire du petit Théo》（2023年），并以作者网站上的“作者媒介”（médiation auctoriale）为题完成了硕士论文（普瓦捷大学，2023年）。他的著作与平面设计作品见于 [karlforterre.fr](https://karlforterre.fr/)。

[gratuites]
question_fr = Les photos sont-elles vraiment gratuites, même pour un usage commercial ?
question_en = Are the photos really free, even for commercial use?
question_zh = 这些照片真的免费吗？可以商用吗？
reponse_fr = Oui. Toutes les photos du site sont publiées sur Pexels, sous la licence Pexels : elles se téléchargent gratuitement, sans inscription, et s'utilisent librement, pour un usage personnel ou commercial, sans droits à régler. On peut les modifier, les imprimer, les publier sur un site, dans une publicité ou sur les réseaux sociaux. Le détail : [Utiliser mes photos](utiliser).
reponse_en = Yes. Every photo on this site is published on Pexels, under the Pexels license: they can be downloaded for free, without an account, and used freely, for personal or commercial purposes, with no fees to pay. You may edit them, print them, and publish them on a website, in an advertisement or on social media. Details: [Use my photos](utiliser).
reponse_zh = 是的。本站所有照片都以 Pexels 许可协议发布在 Pexels 上：无需注册即可免费下载，并可自由用于个人或商业用途，无需支付任何版权费用。您可以修改、印刷这些照片，也可以将它们用于网站、广告或社交媒体。详见：[使用我的照片](utiliser)。

[telecharger]
question_fr = Comment télécharger une photo en haute définition ?
question_en = How do I download a photo in high resolution?
question_zh = 如何下载高清原图？
reponse_fr = Ouvrez la page de la photo sur ce site, puis cliquez sur « Télécharger gratuitement sur Pexels ». Sur Pexels, le bouton de téléchargement gratuit propose l'original en pleine définition ou une version plus légère. Aucune inscription n'est nécessaire.
reponse_en = Open the photo's page on this site, then click “Free download on Pexels”. On Pexels, the free download button offers the full-resolution original or a lighter version. No account is needed.
reponse_zh = 在本站打开照片页面，点击「在 Pexels 免费下载」。在 Pexels 页面上，免费下载按钮可以选择全分辨率原图或较小的版本。无需注册。

[credit]
question_fr = Faut-il créditer le photographe ? Comment citer une photo ?
question_en = Do I need to credit the photographer? How should I cite a photo?
question_zh = 需要注明摄影师吗？如何引用一张照片？
reponse_fr = Ce n'est pas obligatoire, mais toujours apprécié : « Photo : Karl Forterre / Pexels », avec si possible un lien vers la page de la photo. Dans un article ou un travail universitaire, on cite le titre de la photo, son auteur, Pexels et l'adresse de sa page ; chaque page de photo indique aussi son numéro Pexels, qui permet de la retrouver.
reponse_en = It is not required, but always appreciated: “Photo: Karl Forterre / Pexels”, ideally with a link to the photo's page. In an article or academic work, cite the photo's title, its author, Pexels and the address of its page; each photo page also gives its Pexels number, which makes it easy to find again.
reponse_zh = 不是必须的，但我们非常感谢您注明：「摄影：Karl Forterre / Pexels」，最好附上照片页面的链接。在文章或学术作品中，可引用照片标题、作者、Pexels 以及照片页面的网址；每个照片页面还标有 Pexels 编号，便于查找。

[licence]
question_fr = Qu'est-ce que la licence Pexels n'autorise pas ?
question_en = What does the Pexels license not allow?
question_zh = Pexels 许可协议不允许哪些用途？
reponse_fr = Vendre une photo telle quelle, sans l'avoir modifiée (en poster, en tirage ou sur un objet) ; montrer une personne reconnaissable sous un jour dégradant ou offensant ; laisser croire qu'une personne ou une marque visible sur la photo recommande un produit ; redistribuer les photos sur une autre banque d'images ou un site de fonds d'écran ; les utiliser comme marque ou logo. Seul le [texte officiel de la licence Pexels](https://www.pexels.com/license/) fait foi.
reponse_en = Selling an unaltered copy of a photo (as a poster, a print or on a product); showing an identifiable person in a bad light or in an offensive way; implying that a person or brand shown in the photo endorses a product; redistributing the photos on another stock photo or wallpaper platform; using them as a trademark or logo. Only the [official text of the Pexels license](https://www.pexels.com/license/) is legally binding.
reponse_zh = 未经修改直接出售照片（制成海报、印刷品或印在商品上）；以贬损或冒犯的方式展示照片中可辨认的人物；暗示照片中的人物或品牌为某产品背书；在其他图片素材网站或壁纸网站上传播这些照片；将照片用作商标或标志。一切以 [Pexels 许可协议官方文本](https://www.pexels.com/license/)为准。

[pexels]
question_fr = Pourquoi chaque photo mène-t-elle à Pexels ?
question_en = Why does every photo lead to Pexels?
question_zh = 为什么每张照片都链接到 Pexels？
reponse_fr = Pexels héberge les photos en pleine définition et s'occupe des téléchargements, gratuitement ; les images de ce site sont d'ailleurs servies par Pexels. Ce site, lui, les présente : par séries, par galeries de thèmes et de lieux, et par couleurs. Chaque page de photo renvoie à sa page Pexels, où elle se télécharge.
reponse_en = Pexels hosts the photos in full resolution and handles downloads, free of charge; the images on this site are in fact served by Pexels. This site presents them: in series, in galleries of themes and places, and by color. Each photo page links to its Pexels page, where it can be downloaded.
reponse_zh = Pexels 免费托管全分辨率的照片并提供下载服务；本站的图片实际上也由 Pexels 提供。本站则负责展示这些照片：按专题、按主题和地点分类的图库，以及按颜色分类。每个照片页面都链接到对应的 Pexels 页面，可在那里下载。

[lieux]
question_fr = Où les photos ont-elles été prises ?
question_en = Where were the photos taken?
question_zh = 这些照片拍摄于哪里？
reponse_fr = En France et en Espagne. Chaque lieu a sa galerie : {lieux}. Les séries racontent un lieu ou un moment : {series}.
reponse_en = In France and Spain. Each place has its own gallery: {lieux}. The series tell the story of a place or a moment: {series}.
reponse_zh = 拍摄于法国和西班牙。每个地点都有自己的图库：{lieux}。专题则讲述一个地方或一个时刻：{series}。

[trouver]
question_fr = Comment trouver une photo d'un sujet ou d'une couleur précise ?
question_en = How can I find a photo of a particular subject or color?
question_zh = 如何找到特定主题或颜色的照片？
reponse_fr = Les [galeries](galeries) rangent les photos par thème (ciel, jardins, architecture, mer, animaux…) et par lieu ; des pages les rangent aussi par couleur dominante, en bas de la page des galeries. Sous chaque photo, « Photos proches » propose des images qui lui ressemblent. Le [profil Pexels](pexels) de Karl Forterre rassemble aussi toutes ses photos.
reponse_en = The [galleries](galeries) arrange the photos by theme (sky, gardens, architecture, sea, animals…) and by place; other pages sort them by dominant color, at the bottom of the galleries page. Under each photo, “Similar photos” suggests images that resemble it. Karl Forterre's [Pexels profile](pexels) also brings all his photos together.
reponse_zh = [图库](galeries)按主题（天空、花园、建筑、海洋、动物……）和地点整理照片；图库页面底部还有按主色调分类的页面。每张照片下方的「相似照片」会推荐与之相近的图片。Karl Forterre 的 [Pexels 主页](pexels)也汇集了他的全部照片。

[usages]
question_fr = Des médias ont-ils utilisé ces photos ?
question_en = Have these photos been used by the media?
question_zh = 有媒体使用过这些照片吗？
reponse_fr = Oui : Pexels a signalé des utilisations sur {sites}. Ce n'est qu'une petite partie : Pexels ne signale pas chaque téléchargement. Les photos concernées sont sur la page [À propos](apropos#usages).
reponse_en = Yes: Pexels has reported uses on {sites}. This is only a small part: Pexels does not report every download. The photos concerned are listed on the [About](apropos#usages) page.
reponse_zh = 有的：据 Pexels 通知，{sites} 等网站使用过这些照片。这只是其中一小部分：Pexels 并不通报每一次下载。相关照片列在[关于](apropos#usages)页面。

[langues]
question_fr = Le site existe-t-il dans d'autres langues ?
question_en = Is the site available in other languages?
question_zh = 本站有其他语言版本吗？
reponse_fr = Oui : en français, en anglais et en chinois simplifié. Le bouton de langue, en haut de chaque page, passe de l'une à l'autre. Sur les pages chinoises, les liens mènent à l'interface chinoise de Pexels.
reponse_en = Yes: in French, English and Simplified Chinese. The language button at the top of each page switches from one to the next. On the Chinese pages, links lead to the Chinese interface of Pexels.
reponse_zh = 有的：本站提供法语、英语和简体中文版本。每个页面顶部的语言按钮可在各版本之间切换。中文页面上的链接会指向 Pexels 的中文界面。

[suivre]
question_fr = Comment suivre les nouvelles photos ?
question_en = How can I follow new photos?
question_zh = 如何关注最新照片？
reponse_fr = Sur Pexels, avec le bouton « Suivre » du [profil de Karl Forterre](pexels) ; par le [flux RSS](flux) du site ; ou sur [Bluesky](https://bsky.app/profile/karlforterre.bsky.social) et [Mastodon](https://mastodon.social/@KarlForterre), où paraît chaque matin une photo du jour.
reponse_en = On Pexels, with the “Follow” button on [Karl Forterre's profile](pexels); through the site's [RSS feed](flux); or on [Bluesky](https://bsky.app/profile/karlforterre.bsky.social) and [Mastodon](https://mastodon.social/@KarlForterre), where a photo of the day is posted every morning.
reponse_zh = 可以在 Pexels 上点击 [Karl Forterre 主页](pexels)的「关注」按钮；也可以关注 [Bluesky](https://bsky.app/profile/karlforterre.bsky.social) 和 [Mastodon](https://mastodon.social/@KarlForterre)，每天早上都会发布一张「每日一图」。

