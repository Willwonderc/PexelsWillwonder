[mediation-auctoriale]
question_fr = Qu'est-ce que la médiation auctoriale, sujet du mémoire de Karl Forterre ?
question_en = What is authorial mediation, the subject of Karl Forterre's thesis?
question_zh = Karl Forterre 硕士论文的主题“作者媒介”是什么？
reponse_fr = Dans son mémoire de master 2 Livres et médiations (Université de Poitiers, juin 2023), Karl Forterre la définit ainsi : « La médiation auctoriale est un processus par lequel l'auteur met en relation le public avec son travail. Ses supports divers incluent les rencontres en librairies, les réseaux sociaux, les passages à la télévision et la présence sur un site d'auteur. »

    Le mémoire, [L'influence de la médiation auctoriale du site d'auteur](https://karlforterre.fr/memoire/) (texte intégral en [PDF](https://karlforterre.fr/livres/memoire-mediation-auctoriale-2023.pdf)), s'appuie sur un questionnaire rempli par 102 visiteurs de sites d'auteurs et sur des entretiens avec des acteurs de leur création.
reponse_en = In his master's thesis (Master 2 Livres et médiations, University of Poitiers, June 2023), Karl Forterre defines it as follows (translated from French): “Authorial mediation is a process by which the author connects the public with their work. Its various channels include bookshop events, social media, television appearances and a presence on an author's website.”

    The thesis, [L'influence de la médiation auctoriale du site d'auteur](https://karlforterre.fr/memoire/) (“The influence of authorial mediation through the author's website”, full text in French as a [PDF](https://karlforterre.fr/livres/memoire-mediation-auctoriale-2023.pdf)), draws on a questionnaire completed by 102 visitors to author websites and on interviews with people involved in creating them.
reponse_zh = Karl Forterre 在其“书籍与媒介”硕士二年级论文（普瓦捷大学，2023年6月）中这样定义（译自法语）：“作者媒介是作者将公众与其作品联系起来的过程。其载体多种多样，包括书店见面会、社交媒体、电视节目以及作者网站。”

    这篇论文题为 [L'influence de la médiation auctoriale du site d'auteur](https://karlforterre.fr/memoire/)（《作者网站中作者媒介的影响》，法语全文见 [PDF](https://karlforterre.fr/livres/memoire-mediation-auctoriale-2023.pdf)），基于 102 位作者网站访客填写的问卷，以及对网站创建相关人士的访谈。
