# Réglages du site. Après une modification, le site se reconstruit tout seul.

[site]
# Adresse publique du site, sans barre finale. À changer si vous passez
# à un domaine personnel, par exemple https://photos.karlforterre.fr
adresse = https://photos.karlforterre.fr
nom = Karl Forterre
profil_pexels = https://www.pexels.com/@karl-forterre-28489473
site_personnel = https://karlforterre.fr
# Code GoatCounter (mesure d'audience sans cookies) : par exemple karlforterre
# pour https://karlforterre.goatcounter.com. Laisser vide pour ne rien mesurer.
goatcounter =
# Codes de vérification fournis par Google Search Console et par Pinterest
# (balise « meta » : ne recopier que la valeur de content).
google_verification =
pinterest_verification = 99b240d3eeecc5bbe58d593e841ba657
# Nombre minimum de photos pour qu'une galerie soit affichée.
galerie_min = 4
# Flux RSS pour Pinterest : un par galerie, relié à son tableau, et le flux « autres
# photos » pour celles rangées dans aucune galerie. Le journal donnees/parutions.json,
# tenu par la tâche de nuit, note le jour où chaque photo paraît dans chaque flux :
# une photo n'y paraît qu'une fois. Chaque nuit, les photos vues après fonds_date (les
# nouvelles) entrent aussitôt dans leurs flux ; le fonds suit, des photos les plus vues
# aux moins vues sur Pexels, au rythme de epingles_par_jour photos par galerie et de
# epingles_par_jour_autres pour les autres photos. Un flux qui démarre reçoit d'abord
# la moitié de flux_max, et aucun flux ne reçoit davantage en un jour.
# flux_max : nombre de photos présentées par chaque flux, les dernières parues.
flux_max = 12
fonds_date = 2026-09-25
epingles_par_jour = 1
epingles_par_jour_autres = 3
# Plafond de Pinterest : 200 épingles par jour au plus, tous flux confondus.
epingles_max_par_jour = 200

[accueil]
accroche_fr = Photographies libres de droits, à télécharger gratuitement sur Pexels.
accroche_en = Royalty-free photographs, free to download on Pexels.
# Photos qui défilent en plein écran à l'ouverture de l'accueil, en fondu lent :
# 6 à 8 numéros Pexels, de préférence en format paysage. Laisser vide pour prendre
# les premières photos en paysage de selection.txt. La sélection de 24 photos
# présentée sous l'ouverture se règle dans selection.txt.
ouverture = 27116682, 38694057, 34894953, 13102252, 13087478, 39564918

[a-propos]
texte_fr = Karl Forterre photographie les jardins, l'architecture, les paysages et le ciel, en France et en Espagne.

    Toutes ces images sont publiées sur Pexels : chacune est libre de droits et se télécharge gratuitement, sans inscription.
texte_en = Karl Forterre photographs gardens, architecture, landscapes and the sky, in France and Spain.

    All these images are published on Pexels: each one is royalty-free and can be downloaded for free, without an account.
# Facultatif : numéro Pexels d'un portrait de l'auteur, affiché en tête de page.
portrait =
# Facultatif : matériel photo, en quelques lignes.
materiel_fr =
materiel_en =

[mentions]
# Mentions légales (page /mentions-legales/). Pour un site professionnel, la loi
# demande aussi l'adresse et le téléphone de l'éditeur, et son numéro SIRET s'il en
# a un : il suffit de les inscrire ici pour qu'ils s'affichent. Cette adresse de
# contact figure aussi sur les pages « À propos », « Utiliser mes photos » et
# « Confidentialité ».
editeur = Karl Forterre
contact = contact@karlforterre.fr
adresse_postale =
telephone =
siret =
