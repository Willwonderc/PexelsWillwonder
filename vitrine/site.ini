# Réglages du site. Après une modification, le site se reconstruit tout seul.

[site]
# Adresse publique du site, sans barre finale. À changer si vous passez
# à un domaine personnel, par exemple https://photos.karlforterre.fr
adresse = https://photos.karlforterre.fr
nom = Karl Forterre
profil_pexels = https://www.pexels.com/@karl-forterre-28489473
site_personnel = https://karlforterre.fr
# Code GoatCounter (mesure d'audience sans cookies) : par exemple karlforterre
# pour https://karlforterre.goatcounter.com. Laisser vide pour ne rien mesurer.
goatcounter =
# Codes de vérification fournis par Google Search Console, Bing Webmaster Tools et
# Pinterest (balise « meta » : ne recopier que la valeur de content).
google_verification =
bing_verification =
pinterest_verification = 99b240d3eeecc5bbe58d593e841ba657
# Clé IndexNow : chaque nuit, les pages nouvelles, modifiées ou supprimées sont signalées
# à Bing et aux autres moteurs du protocole IndexNow (Yandex, Seznam, Naver…). Cette clé
# n'est pas un secret : le site la publie lui-même, dans /<clé>.txt, pour prouver que
# les signalements viennent de lui. Pour en changer, écrire 32 chiffres et lettres de a
# à f ; laisser vide pour ne plus rien signaler. Mode d'emploi : referencement/README.md.
indexnow = 520a1d98d48e52294d1e9072118ee8fe
# Nombre minimum de photos pour qu'une galerie soit affichée.
galerie_min = 4
# Flux RSS pour Pinterest : un par galerie, relié à son tableau, et le flux « autres
# photos » pour celles rangées dans aucune galerie. Le journal donnees/parutions.json,
# tenu par la tâche de nuit, note le jour où chaque photo paraît dans chaque flux :
# une photo n'y paraît qu'une fois. Chaque nuit, les photos vues après fonds_date (les
# nouvelles) entrent aussitôt dans leurs flux ; le fonds suit, des photos les plus vues
# aux moins vues sur Pexels, au rythme de epingles_par_jour photos par galerie et de
# epingles_par_jour_autres pour les autres photos. Un flux qui démarre reçoit d'abord
# la moitié de flux_max, et aucun flux ne reçoit davantage en un jour.
# flux_max : nombre de photos présentées par chaque flux, les dernières parues.
flux_max = 12
fonds_date = 2026-09-25
epingles_par_jour = 1
epingles_par_jour_autres = 3
# Plafond de Pinterest : 200 épingles par jour au plus, tous flux confondus.
epingles_max_par_jour = 200

[reseaux]
# Vos profils sur les réseaux, en pied de page de chaque page du site : une ligne par
# réseau, le nom affiché, un signe =, puis l'adresse du profil. Pour en ajouter un,
# écrire une ligne ; pour en retirer un, effacer la sienne. Chaque lien porte rel="me",
# grâce auquel Mastodon affiche une coche verte à côté de l'adresse du site.
Mastodon = https://mastodon.social/@KarlForterre
Bluesky = https://bsky.app/profile/karlforterre.bsky.social
LinkedIn = https://www.linkedin.com/in/karl-forterre-720b61220/
# RedNote : compte « Soviet Croissant », rednote ID 26225410141. Retirer le # et coller
# l'adresse du profil : dans l'application, Moi → flèche de partage en haut à droite →
# « Copier le lien ». Elle a la forme https://www.xiaohongshu.com/user/profile/… (un
# lien court xhslink.com convient aussi : une session Claude le convertira).
# RedNote = 

[personne]
# L'auteur dans les données structurées (schema.org Person) que lisent Google, Bing et
# les assistants IA : elles font du site photo, de karlforterre.fr, du profil Pexels et
# des réseaux de la rubrique [reseaux] une seule et même personne.
# identifiant : le même que dans les données de karlforterre.fr ; ne pas le changer.
identifiant = https://karlforterre.fr/#auteur
prenom = Karl
nom_de_famille = Forterre
# Adresse d'un portrait (celui de karlforterre.fr).
portrait = https://karlforterre.fr/images/auteur/portrait.webp
metier_fr = photographe, auteur
metier_en = photographer, writer
metier_zh = 摄影师, 作家
lieu_fr = Niort, France
lieu_en = Niort, France
lieu_zh = 法国尼奥尔
nationalite = France
formation = Université de Poitiers
# Domaines de compétence, séparés par des virgules.
domaines_fr = photographie de paysage, photographie d'architecture, jardins, astrophotographie, graphisme, édition, médiation auctoriale
domaines_en = landscape photography, architectural photography, gardens, astrophotography, graphic design, publishing, authorial mediation
domaines_zh = 风光摄影, 建筑摄影, 园林, 天文摄影, 平面设计, 出版, 作者媒介
# Autres adresses qui désignent Karl Forterre, sans lien en pied de page, séparées par
# des virgules : sa fiche Wikidata une fois créée (https://www.wikidata.org/wiki/Q…),
# son identifiant ORCID, sa notice BnF… Mode d'emploi : referencement/README.md.
profils =

[photo_du_jour]
# Langue des publications de la photo du jour sur Bluesky et Mastodon (reseaux/) :
# en (anglais), fr (français) ou zh (chinois). Le lien mène à la page de la photo
# dans cette langue.
langue = en

[accueil]
accroche_fr = Photographies libres de droits, à télécharger gratuitement sur Pexels.
accroche_en = Royalty-free photographs, free to download on Pexels.
accroche_zh = 免版税摄影作品，可在 Pexels 免费下载。
# Photos qui défilent en plein écran à l'ouverture de l'accueil, en fondu lent :
# 6 à 8 numéros Pexels, de préférence en format paysage. Laisser vide pour prendre
# les premières photos en paysage de selection.txt. La sélection de 24 photos
# présentée sous l'ouverture se règle dans selection.txt.
ouverture = 27116682, 38694057, 34894953, 13102252, 13087478, 39564918

[a-propos]
texte_fr = Karl Forterre photographie les jardins, l'architecture, les paysages et le ciel, en France et en Espagne.

    Toutes ces images sont publiées sur Pexels : chacune est libre de droits et se télécharge gratuitement, sans inscription.
texte_en = Karl Forterre photographs gardens, architecture, landscapes and the sky, in France and Spain.

    All these images are published on Pexels: each one is royalty-free and can be downloaded for free, without an account.
texte_zh = Karl Forterre 拍摄法国和西班牙的花园、建筑、风光与天空。

    所有这些作品都发布在 Pexels 上：每一张都免版税，无需注册即可免费下载。
# Facultatif : numéro Pexels d'un portrait de l'auteur, affiché en tête de page.
portrait =
# Facultatif : matériel photo, en quelques lignes.
materiel_fr =
materiel_en =
# Facultatif : l'auteur, en quelques lignes, suivies d'un lien vers site_personnel.
auteur_fr = Karl Forterre est aussi auteur : il a publié en 2023 la nouvelle Darshan et L'histoire du petit Théo, un conte au format roman, à la Société des Éditions du Poitou, dans la collection Cheminement qu'il a créée, et consacré son mémoire de master à la médiation auctoriale des sites d'auteurs. Ses livres et ses créations graphiques sont présentés sur son site.
auteur_en = Karl Forterre is also a writer: in 2023 he published the short story Darshan and L'histoire du petit Théo, a novel-length tale, with the Société des Éditions du Poitou, in the Cheminement collection he created, and devoted his master's thesis to how authors present themselves on their websites. His books and graphic work are presented on his website.
auteur_zh = Karl Forterre 也是一位作家：2023年，他在自己创立的丛书 Cheminement（意为“历程”）中，由 Société des Éditions du Poitou 出版社出版了短篇小说《Darshan》（梵语词，意为“觐见”）与长篇童话《L’histoire du petit Théo》（意为“小忒奥的故事”），并以作者如何在个人网站上进行自我呈现为题完成了硕士论文。他的著作与平面设计作品见于他的个人网站。

[mentions]
