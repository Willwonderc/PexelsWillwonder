# Publie chaque jour la « photo du jour » : le matin sur Bluesky et sur Instagram,
# l'après-midi sur Mastodon (ou Pixelfed), quand son public anglophone, européen et
# américain, est éveillé ; puis enregistre sur main le journal des publications
# (reseaux/photo-du-jour.json). Sans les secrets d'un réseau, ce réseau est laissé de
# côté, sans erreur. Le jeton Instagram est renouvelé chaque semaine par la tâche
# « Jeton Instagram » (jeton-instagram.yml). Mode d'emploi : reseaux/README.md.
name: Photo du jour

on:
  # GitHub lance les tâches programmées avec des heures de retard : de 5 à 8 heures le
  # matin et d'environ 4 heures 30 l'après-midi, du 27 septembre au 3 octobre 2026. Chaque
  # publication a donc un passage avancé, qui attend l'heure prévue s'il arrive en avance,
  # et un passage de secours à l'heure prévue, qui ne publie que ce qui manque encore.
  schedule:
    # Bluesky et Instagram à 6 h 47 UTC : 8 h 47 à Paris en été, 7 h 47 en hiver.
    - cron: "17 1 * * *"
    - cron: "47 6 * * *"
    # Mastodon à 15 h 47 UTC : 17 h 47 à Paris en été, 11 h 47 à New York.
    - cron: "47 10 * * *"
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: photo-du-jour
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    # 5 heures 30 d'attente au plus, puis la publication.
    timeout-minutes: 355
    steps:
      # Un passage avancé arrivé avant l'heure prévue l'attend ; arrivé après, il publie
      # tout de suite. Lancée à la main (Run workflow), la tâche n'attend pas.
      - name: Attendre l'heure de publication
        env:
          PASSAGE: ${{ github.event.schedule }}
        run: |
          case "$PASSAGE" in
            "17 1 * * *"|"47 6 * * *") heure="06:47" ;;
            "47 10 * * *"|"47 15 * * *") heure="15:47" ;;
            *) exit 0 ;;
          esac
          attente=$(( $(date -u -d "today $heure" +%s) - $(date -u +%s) ))
          if [ "$attente" -gt 0 ]; then
            echo "En avance : attente de $(( attente / 60 )) minutes, jusqu'à $heure UTC."
            sleep "$attente"
          fi

      # Toujours la dernière version de main, qui contient le journal du passage précédent.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publier la photo du jour
        env:
          BLUESKY_IDENTIFIANT: ${{ secrets.BLUESKY_IDENTIFIANT }}
          BLUESKY_MOT_DE_PASSE_APPLI: ${{ secrets.BLUESKY_MOT_DE_PASSE_APPLI }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_JETON: ${{ secrets.MASTODON_JETON }}
          INSTAGRAM_JETON: ${{ secrets.INSTAGRAM_JETON }}
          PASSAGE: ${{ github.event.schedule }}
        # Lancée à la main (Run workflow), la tâche publie sur tous les réseaux qui n'ont
        # pas encore eu leur photo du jour.
        run: |
          case "$PASSAGE" in
            "17 1 * * *"|"47 6 * * *") python3 reseaux/photo_du_jour.py --reseaux bluesky,instagram ;;
            "47 10 * * *"|"47 15 * * *") python3 reseaux/photo_du_jour.py --reseaux mastodon ;;
            *) python3 reseaux/photo_du_jour.py ;;
          esac

      # Même si un réseau a échoué, garder la trace de ce que les autres ont publié.
      - name: Enregistrer le journal des publications
        if: always()
        run: |
          if [ -n "$(git status --porcelain reseaux/photo-du-jour.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reseaux/photo-du-jour.json
            git commit -m "Photo du jour publiée"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
