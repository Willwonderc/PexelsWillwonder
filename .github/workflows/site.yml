# Construit le site de photographe et le publie sur GitHub Pages :
# chaque nuit, après chaque modification de main, ou à la demande (Run workflow).
# Chaque passage enregistre sur main les nouvelles fiches Pexels et le journal des
# parutions Pinterest (vitrine/donnees/).
name: Site

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      # Toujours la dernière version de main, qui contient le journal du passage précédent.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Lire les nouvelles photos et construire le site
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python3 vitrine/build.py --enregistrer-parutions

      - name: Enregistrer les fiches Pexels et le journal des parutions
        run: |
          if [ -n "$(git status --porcelain vitrine/donnees)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add vitrine/donnees/fiches.json vitrine/donnees/parutions.json
            git commit -m "Fiches Pexels et parutions Pinterest mises à jour"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
